<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Draft</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f0f0f; 
            color: white; 
            font-family: Arial, sans-serif; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header { 
            background: #1a1a1a; 
            padding: 20px; 
            text-align: center; 
            font-size: 24px; 
            font-weight: bold;
            border-bottom: 3px solid #333;
        }
        
        .main-content { 
            display: flex; 
            flex: 1; 
            padding: 20px; 
            gap: 20px; 
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }
        
        .side { 
            width: 350px; 
            background: #222; 
            padding: 20px; 
            border-radius: 10px;
            border: 3px solid;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .blue-side { border-color: #3498db; }
        .red-side { border-color: #e74c3c; }
        
        .team-header {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 2px solid;
        }
        
        .blue-header { color: #3498db; border-color: #3498db; }
        .red-header { color: #e74c3c; border-color: #e74c3c; }
        
        .bans-container, .picks-container {
            background: #333;
            padding: 15px;
            border-radius: 8px;
        }
        
        .section-title {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .ban-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        .ban-slot {
            width: 80px;
            height: 80px;
            background: #444;
            border: 3px dashed #666;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .ban-slot.hidden {
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 24px;
            font-weight: bold;
        }
        
        .ban-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) brightness(0.6);
        }
        
        .pick-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        
        .pick-slot {
            width: 200px;
            height: 200px;
            background: #444;
            border: 4px solid #666;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }
        
        .pick-slot.active {
            border-color: #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(46, 204, 113, 0.5); }
            50% { box-shadow: 0 0 30px rgba(46, 204, 113, 0.8); }
        }
        
        .pick-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .slot-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            padding: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .center {
            flex: 1;
            background: #222;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        #search {
            padding: 15px;
            background: #333;
            border: 2px solid #444;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            width: 100%;
        }
        
        .grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .brawler-card {
            width: 100px;
            height: 100px;
            background: #333;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        
        .brawler-card:hover {
            transform: scale(1.05);
            border-color: #3498db;
        }
        
        .brawler-card.disabled {
            opacity: 0.3;
            filter: grayscale(1);
            cursor: not-allowed;
        }
        
        .brawler-card img {
            width: 100%;
            height: 70px;
            object-fit: contain;
            padding: 5px;
        }
        
        .brawler-name {
            height: 30px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .start-btn {
            background: #2ecc71;
            color: white;
        }
        
        .reset-btn {
            background: #e74c3c;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #3498db;
            color: white;
            padding: 15px;
            border-radius: 8px;
            animation: fadeInOut 3s;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header" id="status">Brawl Stars Draft</div>
    
    <div class="main-content">
        <!-- Синяя команда -->
        <div class="side blue-side">
            <div class="team-header blue-header">СИНЯЯ КОМАНДА</div>
            
            <div class="bans-container">
                <div class="section-title">БАНЫ (3)</div>
                <div class="ban-row" id="blue-bans-ui">
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                </div>
            </div>
            
            <div class="picks-container">
                <div class="section-title">ПИКИ (3)</div>
                <div class="pick-column" id="blue-picks-ui">
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                </div>
            </div>
        </div>
        
        <!-- Центр -->
        <div class="center">
            <input type="text" id="search" placeholder="Поиск бравлера..." autocomplete="off">
            <div class="grid" id="grid">
                <!-- Бравлеры загружаются динамически -->
            </div>
            
            <div class="controls">
                <button class="btn start-btn" onclick="startDraft()">НАЧАТЬ ДРАФТ</button>
                <button class="btn reset-btn" onclick="resetDraft()">СБРОСИТЬ</button>
            </div>
        </div>
        
        <!-- Красная команда -->
        <div class="side red-side">
            <div class="team-header red-header">КРАСНАЯ КОМАНДА</div>
            
            <div class="bans-container">
                <div class="section-title">БАНЫ (3)</div>
                <div class="ban-row" id="red-bans-ui">
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                </div>
            </div>
            
            <div class="picks-container">
                <div class="section-title">ПИКИ (3)</div>
                <div class="pick-column" id="red-picks-ui">
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="notification"></div>
    
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        let myTeam = urlParams.get('team') || 'spectator';
        
        let brawlers = [];
        let draftState = {};
        let resetTimer = null;
        
        socket.on('connect', () => {
            console.log('✅ Подключено к серверу');
            showNotification('Подключено к серверу');
        });
        
        socket.on('brawlers_list', (data) => {
            brawlers = data;
            renderBrawlers();
        });
        
        socket.on('update_draft', (data) => {
            draftState = data;
            updateUI();
            
            if (data.phase === 'finished') {
                startResetTimer();
            } else {
                if (resetTimer) {
                    clearInterval(resetTimer);
                    resetTimer = null;
                }
            }
        });
        
        socket.on('draft_reset', () => {
            showNotification('Драфт сброшен!');
            if (resetTimer) {
                clearInterval(resetTimer);
                resetTimer = null;
            }
        });
        
        function startDraft() {
            if (myTeam === 'spectator') {
                showNotification('Только игроки могут начать драфт');
                return;
            }
            socket.emit('start_draft');
        }
        
        function resetDraft() {
            socket.emit('reset_draft');
        }
        
        function renderBrawlers() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            brawlers.forEach(brawler => {
                const card = document.createElement('div');
                card.className = 'brawler-card';
                card.id = `card-${brawler}`;
                
                if (draftState.all_selected?.includes(brawler)) {
                    card.classList.add('disabled');
                }
                
                const imgUrl = `/static/brawler_images/${brawler}.png`;
                card.innerHTML = `
                    <img src="${imgUrl}" alt="${brawler}" 
                         onerror="this.onerror=null; this.style.backgroundColor='#333';">
                    <div class="brawler-name">${brawler}</div>
                `;
                
                card.onclick = () => {
                    if (myTeam === 'spectator') {
                        showNotification('Наблюдатели не могут выбирать');
                        return;
                    }
                    
                    if (card.classList.contains('disabled')) {
                        showNotification('Бравлер уже выбран');
                        return;
                    }
                    
                    if (draftState.phase === 'waiting') {
                        showNotification('Начните драфт сначала');
                        return;
                    }
                    
                    if (draftState.phase === 'finished') {
                        showNotification('Драфт завершен');
                        return;
                    }
                    
                    socket.emit('select_brawler', {
                        brawler: brawler,
                        team: myTeam
                    });
                };
                
                grid.appendChild(card);
            });
        }
        
        function updateUI() {
            // Обновляем статус
            updateStatus();
            
            // Обновляем слоты
            updateTeamSlots('blue', draftState.blue_bans, draftState.blue_picks);
            updateTeamSlots('red', draftState.red_bans, draftState.red_picks);
            
            // Обновляем карточки
            renderBrawlers();
        }
        
        function updateStatus() {
            const status = document.getElementById('status');
            
            switch(draftState.phase) {
                case 'waiting':
                    status.textContent = 'ОЖИДАНИЕ НАЧАЛА ДРАФТА';
                    break;
                case 'ban_blue':
                    status.textContent = 'БАНИ: СИНЯЯ КОМАНДА';
                    break;
                case 'ban_red':
                    status.textContent = 'БАНИ: КРАСНАЯ КОМАНДА';
                    break;
                case 'pick':
                    const current = draftState.current_pick_index + 1;
                    const team = draftState.current_turn === 'blue' ? 'СИНЯЯ' : 'КРАСНАЯ';
                    status.textContent = `ПИК ${current}/6: ${team} КОМАНДА`;
                    break;
                case 'finished':
                    status.textContent = 'ДРАФТ ЗАВЕРШЕН';
                    break;
            }
        }
        
        function updateTeamSlots(team, bans, picks) {
            const banSlots = document.querySelectorAll(`#${team}-bans-ui .ban-slot`);
            const pickSlots = document.querySelectorAll(`#${team}-picks-ui .pick-slot`);
            
            // Баны
            bans.forEach((brawler, i) => {
                if (i < banSlots.length) {
                    if (brawler === 'hidden') {
                        banSlots[i].className = 'ban-slot hidden';
                        banSlots[i].innerHTML = '?';
                    } else {
                        banSlots[i].className = 'ban-slot';
                        banSlots[i].innerHTML = `<img src="/static/brawler_images/${brawler}.png" alt="${brawler}">`;
                    }
                }
            });
            
            // Пики
            picks.forEach((brawler, i) => {
                if (i < pickSlots.length) {
                    pickSlots[i].innerHTML = `
                        <img src="/static/brawler_images/${brawler}.png" alt="${brawler}">
                        <div class="slot-name">${brawler}</div>
                    `;
                    pickSlots[i].classList.remove('active');
                }
            });
            
            // Подсвечиваем активный слот
            if (draftState.phase === 'pick' && draftState.current_turn === team) {
                const emptyIndex = team === 'blue' ? draftState.blue_picks.length : draftState.red_picks.length;
                if (emptyIndex < pickSlots.length) {
                    pickSlots[emptyIndex].classList.add('active');
                }
            }
        }
        
        function startResetTimer() {
            let seconds = 60;
            updateTimerDisplay(seconds);
            
            if (resetTimer) clearInterval(resetTimer);
            
            resetTimer = setInterval(() => {
                seconds--;
                updateTimerDisplay(seconds);
                
                if (seconds <= 0) {
                    clearInterval(resetTimer);
                    resetTimer = null;
                }
            }, 1000);
        }
        
        function updateTimerDisplay(seconds) {
            const status = document.getElementById('status');
            if (draftState.phase === 'finished') {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                status.textContent = `ДРАФТ ЗАВЕРШЕН (сброс через ${mins}:${secs.toString().padStart(2, '0')})`;
            }
        }
        
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        // Поиск
        document.getElementById('search').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            brawlers.forEach(brawler => {
                const card = document.getElementById(`card-${brawler}`);
                if (card) {
                    card.style.display = brawler.toLowerCase().includes(query) ? 'flex' : 'none';
                }
            });
        });
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            if (myTeam === 'blue') {
                showNotification('Вы играете за синюю команду');
            } else if (myTeam === 'red') {
                showNotification('Вы играете за красную команду');
            } else {
                showNotification('Вы наблюдатель');
            }
        });
    </script>
</body>
</html>
