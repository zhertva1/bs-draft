<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Draft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f0f0f; 
            color: white; 
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header { 
            background: #1a1a1a; 
            padding: 20px; 
            text-align: center; 
            font-size: 24px; 
            font-weight: bold;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #333;
        }
        
        .draft-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .team-side {
            width: 350px;
            background: #222; 
            padding: 20px; 
            border-radius: 10px;
            border: 3px solid;
        }
        
        .team-blue { border-color: #3498db; }
        .team-red { border-color: #e74c3c; }
        
        .team-header {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid;
        }
        
        .team-blue .team-header { color: #3498db; border-color: #3498db; }
        .team-red .team-header { color: #e74c3c; border-color: #e74c3c; }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .bans-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .ban-slot {
            width: 80px;
            height: 80px;
            background: #444;
            border: 3px dashed #666;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #666;
            font-weight: bold;
        }
        
        .ban-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) brightness(0.6);
        }
        
        .picks-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        
        .pick-slot {
            width: 200px;
            height: 200px;
            background: #444;
            border: 4px solid #666;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .pick-slot.active {
            border-color: #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(46, 204, 113, 0.5); }
            50% { box-shadow: 0 0 30px rgba(46, 204, 113, 0.8); }
        }
        
        .pick-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .slot-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            padding: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .center-panel {
            flex: 1;
            background: #222;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
        }
        
        .search-box {
            padding: 15px;
            background: #333;
            border: 2px solid #444;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .brawlers-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            overflow-y: auto;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 8px;
            max-height: 500px;
        }
        
        .brawler-card {
            width: 100px;
            height: 100px;
            background: #333;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .brawler-card:hover {
            transform: scale(1.05);
            border-color: #3498db;
        }
        
        .brawler-card.disabled {
            opacity: 0.3;
            filter: grayscale(1);
            cursor: not-allowed;
        }
        
        .brawler-card img {
            width: 100%;
            height: 70px;
            object-fit: contain;
            padding: 5px;
        }
        
        .brawler-name {
            height: 30px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-start {
            background: #2ecc71;
            color: white;
        }
        
        .btn-reset {
            background: #e74c3c;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #3498db;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s, fadeOut 0.3s 2.7s forwards;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            to { opacity: 0; }
        }
        
        .timer {
            font-size: 14px;
            color: #f39c12;
            text-align: center;
            margin-top: 10px;
        }
        
        .team-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .team-btn {
            padding: 10px 30px;
            border: 2px solid;
            border-radius: 8px;
            background: transparent;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .team-btn.active {
            background: #3498db;
            border-color: #3498db;
        }
        
        .team-btn.red.active {
            background: #e74c3c;
            border-color: #e74c3c;
        }
        
        .team-btn.blue { border-color: #3498db; }
        .team-btn.red { border-color: #e74c3c; }
        .team-btn.spectator { border-color: #95a5a6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" id="status">Brawl Stars Draft</div>
        
        <div class="team-selector">
            <button class="team-btn blue" onclick="setTeam('blue')">Синяя команда</button>
            <button class="team-btn red" onclick="setTeam('red')">Красная команда</button>
            <button class="team-btn spectator active" onclick="setTeam('spectator')">Наблюдатель</button>
        </div>
        
        <div class="draft-container">
            <!-- Синяя команда -->
            <div class="team-side team-blue">
                <div class="team-header">СИНЯЯ КОМАНДА</div>
                
                <div class="section">
                    <div class="section-title">БАНЫ (3)</div>
                    <div class="bans-row" id="blue-bans">
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">ПИКИ (3)</div>
                    <div class="picks-column" id="blue-picks">
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                    </div>
                </div>
            </div>
            
            <!-- Центральная панель -->
            <div class="center-panel">
                <input type="text" class="search-box" id="search" placeholder="Поиск бравлера..." autocomplete="off">
                
                <div class="brawlers-grid" id="brawlers-grid">
                    <!-- Бравлеры будут загружены здесь -->
                </div>
                
                <div class="controls">
                    <button class="btn btn-start" onclick="startDraft()">НАЧАТЬ ДРАФТ</button>
                    <button class="btn btn-reset" onclick="resetDraft()">СБРОСИТЬ</button>
                </div>
                
                <div class="timer" id="timer"></div>
            </div>
            
            <!-- Красная команда -->
            <div class="team-side team-red">
                <div class="team-header">КРАСНАЯ КОМАНДА</div>
                
                <div class="section">
                    <div class="section-title">БАНЫ (3)</div>
                    <div class="bans-row" id="red-bans">
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">ПИКИ (3)</div>
                    <div class="picks-column" id="red-picks">
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="notification-container"></div>
    
    <script>
        let currentTeam = 'spectator';
        let brawlers = [];
        let draftState = null;
        let autoResetTimer = null;
        
        function setTeam(team) {
            currentTeam = team;
            
            // Обновляем активные кнопки
            document.querySelectorAll('.team-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Загружаем состояние для новой команды
            loadState();
            
            showNotification(`Вы теперь: ${
                team === 'blue' ? 'Синяя команда' : 
                team === 'red' ? 'Красная команда' : 'Наблюдатель'
            }`);
        }
        
        async function loadState() {
            try {
                const response = await fetch(`/api/state?team=${currentTeam}`);
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    brawlers = data.brawlers || [];
                    updateUI();
                    renderBrawlers();
                }
            } catch (error) {
                console.error('Ошибка загрузки состояния:', error);
            }
        }
        
        async function startDraft() {
            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    renderBrawlers();
                    showNotification('Драфт начат!');
                }
            } catch (error) {
                console.error('Ошибка начала драфта:', error);
            }
        }
        
        async function resetDraft() {
            if (!confirm('Сбросить драфт? Все текущие выборы будут потеряны.')) {
                return;
            }
            
            try {
                const response = await fetch('/api/reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    renderBrawlers();
                    showNotification('Драфт сброшен!');
                    
                    if (autoResetTimer) {
                        clearInterval(autoResetTimer);
                        autoResetTimer = null;
                    }
                }
            } catch (error) {
                console.error('Ошибка сброса драфта:', error);
            }
        }
        
        async function selectBrawler(brawler) {
            if (currentTeam === 'spectator') {
                showNotification('Наблюдатели не могут выбирать бравлеров');
                return;
            }
            
            try {
                const response = await fetch('/api/select', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        brawler: brawler,
                        team: currentTeam
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    renderBrawlers();
                } else {
                    if (data.auto_reset) {
                        showNotification('Драфт был автоматически сброшен через 1 минуту');
                        loadState();
                    } else {
                        showNotification(data.error || 'Ошибка выбора');
                    }
                }
            } catch (error) {
                console.error('Ошибка выбора бравлера:', error);
            }
        }
        
        function updateUI() {
            if (!draftState) return;
            
            // Обновляем статус
            const statusEl = document.getElementById('status');
            let statusText = '';
            
            switch(draftState.phase) {
                case 'waiting':
                    statusText = 'ОЖИДАНИЕ НАЧАЛА ДРАФТА';
                    break;
                case 'ban_blue':
                    statusText = 'БАНИ: СИНЯЯ КОМАНДА';
                    break;
                case 'ban_red':
                    statusText = 'БАНИ: КРАСНАЯ КОМАНДА';
                    break;
                case 'pick':
                    const currentPick = draftState.current_pick_index + 1;
                    const teamTurn = draftState.current_turn === 'blue' ? 'СИНЯЯ' : 'КРАСНАЯ';
                    statusText = `ПИК ${currentPick}/6: ${teamTurn} КОМАНДА`;
                    break;
                case 'finished':
                    statusText = 'ДРАФТ ЗАВЕРШЕН';
                    break;
            }
            
            statusEl.textContent = statusText;
            
            // Обновляем таймер автосброса
            const timerEl = document.getElementById('timer');
            if (draftState.phase === 'finished' && draftState.reset_in) {
                timerEl.textContent = `Автосброс через: ${draftState.reset_in} сек`;
                
                // Запускаем/обновляем таймер обратного отсчета
                if (autoResetTimer) {
                    clearInterval(autoResetTimer);
                }
                
                let secondsLeft = draftState.reset_in;
                autoResetTimer = setInterval(() => {
                    secondsLeft--;
                    timerEl.textContent = `Автосброс через: ${secondsLeft} сек`;
                    
                    if (secondsLeft <= 0) {
                        clearInterval(autoResetTimer);
                        autoResetTimer = null;
                        loadState(); // Перезагружаем состояние после сброса
                    }
                }, 1000);
            } else {
                timerEl.textContent = '';
                if (autoResetTimer) {
                    clearInterval(autoResetTimer);
                    autoResetTimer = null;
                }
            }
            
            // Обновляем слоты команд
            updateTeamSlots('blue', draftState.blue_bans, draftState.blue_picks);
            updateTeamSlots('red', draftState.red_bans, draftState.red_picks);
        }
        
        function updateTeamSlots(team, bans, picks) {
            const banSlots = document.querySelectorAll(`#${team}-bans .ban-slot`);
            const pickSlots = document.querySelectorAll(`#${team}-picks .pick-slot`);
            
            // Очищаем все слоты
            banSlots.forEach(slot => {
                slot.innerHTML = '';
                slot.style.background = '#444';
                slot.style.borderStyle = 'dashed';
            });
            
            pickSlots.forEach(slot => {
                slot.innerHTML = '';
                slot.classList.remove('active');
            });
            
            // Заполняем баны
            bans.forEach((brawler, index) => {
                if (index < banSlots.length) {
                    if (brawler === 'hidden') {
                        banSlots[index].textContent = '?';
                        banSlots[index].style.background = '#333';
                    } else {
                        const imgUrl = `/static/brawler_images/${brawler}.png`;
                        banSlots[index].innerHTML = `<img src="${imgUrl}" alt="${brawler}">`;
                        banSlots[index].style.borderStyle = 'solid';
                    }
                }
            });
            
            // Заполняем пики
            picks.forEach((brawler, index) => {
                if (index < pickSlots.length) {
                    const imgUrl = `/static/brawler_images/${brawler}.png`;
                    pickSlots[index].innerHTML = `
                        <img src="${imgUrl}" alt="${brawler}">
                        <div class="slot-name">${brawler.toUpperCase()}</div>
                    `;
                    
                    // Подсвечиваем активный слот
                    if (draftState.phase === 'pick' && 
                        draftState.current_turn === team && 
                        index === picks.length) {
                        pickSlots[index].classList.add('active');
                    }
                }
            });
        }
        
        function renderBrawlers() {
            const grid = document.getElementById('brawlers-grid');
            grid.innerHTML = '';
            
            if (!brawlers.length) {
                grid.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">Загрузка бравлеров...</div>';
                return;
            }
            
            // Фильтрация по поиску
            const searchQuery = document.getElementById('search').value.toLowerCase();
            
            brawlers.forEach(brawler => {
                const isSelected = draftState?.all_selected?.includes(brawler) || false;
                
                // Проверяем поиск
                if (searchQuery && !brawler.toLowerCase().includes(searchQuery)) {
                    return;
                }
                
                const card = document.createElement('div');
                card.className = `brawler-card ${isSelected ? 'disabled' : ''}`;
                card.innerHTML = `
                    <img src="/static/brawler_images/${brawler}.png" alt="${brawler}">
                    <div class="brawler-name">${brawler}</div>
                `;
                
                if (!isSelected) {
                    card.onclick = () => selectBrawler(brawler);
                }
                
                grid.appendChild(card);
            });
        }
        
        function showNotification(message) {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            // Загружаем начальное состояние
            loadState();
            
            // Настраиваем поиск
            document.getElementById('search').addEventListener('input', renderBrawlers);
            
            // Автообновление состояния каждые 2 секунды
            setInterval(loadState, 2000);
        });
    </script>
</body>
</html>
