<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Draft</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a14;
            color: white;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(circle at 20% 50%, rgba(41, 128, 185, 0.1) 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, rgba(231, 76, 60, 0.1) 0%, transparent 50%);
        }
        
        /* Шапка */
        .header {
            background: linear-gradient(135deg, #1a1a2a 0%, #2a2a3a 100%);
            padding: 15px 30px;
            border-bottom: 3px solid #3498db;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3498db, #e74c3c);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(45deg, #3498db, #e74c3c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .status-container {
            text-align: center;
            flex-grow: 1;
            margin: 0 20px;
        }
        
        #status {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .timer {
            font-size: 14px;
            color: #95a5a6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .team-indicator {
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            min-width: 150px;
            text-align: center;
        }
        
        .team-blue-indicator {
            background: linear-gradient(135deg, #3498db, #2980b9);
            border: 2px solid #3498db;
        }
        
        .team-red-indicator {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: 2px solid #e74c3c;
        }
        
        .team-spectator-indicator {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            border: 2px solid #95a5a6;
        }
        
        /* Основной контент */
        .main-content {
            display: flex;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            min-height: calc(100vh - 120px);
        }
        
        /* Боковые панели команд */
        .side {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            background: rgba(26, 26, 42, 0.9);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .blue-side {
            border-color: #3498db;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.3);
        }
        
        .red-side {
            border-color: #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.3);
        }
        
        .side-header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .blue-header {
            color: #3498db;
            border-color: #3498db;
        }
        
        .red-header {
            color: #e74c3c;
            border-color: #e74c3c;
        }
        
        /* Блок банов */
        .bans-container {
            background: rgba(40, 40, 60, 0.7);
            border-radius: 12px;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .section-title {
            font-size: 16px;
            color: #bdc3c7;
            text-align: center;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .section-title span {
            font-size: 14px;
            color: #ecf0f1;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
        }
        
        .ban-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        .ban-slot {
            width: 80px;
            height: 80px;
            background: rgba(30, 30, 45, 0.8);
            border: 3px dashed rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .ban-slot.hidden::after {
            content: '?';
            color: rgba(255, 255, 255, 0.3);
            font-size: 24px;
            font-weight: bold;
        }
        
        .ban-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.6);
        }
        
        /* Блок пиков */
        .picks-container {
            flex: 1;
            background: rgba(40, 40, 60, 0.7);
            border-radius: 12px;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .pick-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }
        
        .pick-slot {
            width: 200px;
            height: 200px;
            background: rgba(30, 30, 45, 0.8);
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin: 0 auto;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        
        .pick-slot.active {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(52, 152, 219, 0.5); }
            50% { box-shadow: 0 0 40px rgba(52, 152, 219, 0.8); }
        }
        
        .pick-slot.active.red {
            animation: pulse-red 2s infinite;
        }
        
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 20px rgba(231, 76, 60, 0.5); }
            50% { box-shadow: 0 0 40px rgba(231, 76, 60, 0.8); }
        }
        
        .pick-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .slot-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        /* Центральная панель */
        .center {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(26, 26, 42, 0.9);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .search-container {
            position: relative;
        }
        
        #search {
            width: 100%;
            padding: 18px 20px 18px 50px;
            background: rgba(40, 40, 60, 0.9);
            border: 2px solid rgba(52, 152, 219, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        #search:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.3);
        }
        
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #3498db;
            font-size: 18px;
        }
        
        .grid-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: rgba(40, 40, 60, 0.5);
            border-radius: 12px;
            padding: 15px;
        }
        
        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }
        
        .brawlers-count {
            font-size: 16px;
            color: #bdc3c7;
        }
        
        .brawlers-count span {
            color: #ecf0f1;
            font-weight: bold;
            margin: 0 5px;
        }
        
        .grid-controls {
            display: flex;
            gap: 10px;
        }
        
        .grid-btn {
            padding: 8px 16px;
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid rgba(52, 152, 219, 0.4);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .grid-btn:hover {
            background: rgba(52, 152, 219, 0.4);
            transform: translateY(-2px);
        }
        
        .grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            overflow-y: auto;
            padding: 10px;
            padding-right: 15px;
        }
        
        .grid::-webkit-scrollbar {
            width: 10px;
        }
        
        .grid::-webkit-scrollbar-track {
            background: rgba(40, 40, 60, 0.5);
            border-radius: 5px;
        }
        
        .grid::-webkit-scrollbar-thumb {
            background: #3498db;
            border-radius: 5px;
        }
        
        /* Карточки бравлеров */
        .brawler-card {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.1), rgba(231, 76, 60, 0.1));
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .brawler-card:hover:not(.disabled) {
            transform: translateY(-5px) scale(1.05);
            border-color: #3498db;
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
        }
        
        .brawler-card.disabled {
            opacity: 0.25;
            filter: grayscale(100%);
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        
        .brawler-img-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background: rgba(30, 30, 45, 0.7);
        }
        
        .brawler-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        
        .brawler-card:hover:not(.disabled) img {
            transform: scale(1.1);
        }
        
        .brawler-name {
            height: 24px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        /* Кнопки */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .control-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        
        .start-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }
        
        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }
        
        .reset-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        
        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
        }
        
        /* Уведомления */
        .notification {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.4);
            animation: slideIn 0.5s ease, fadeOut 0.5s ease 4.5s;
            animation-fill-mode: forwards;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 400px;
            text-align: center;
        }
        
        @keyframes slideIn {
            from { top: -100px; opacity: 0; }
            to { top: 100px; opacity: 1; }
        }
        
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
        
        /* Адаптивность */
        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
            }
            
            .side {
                width: 100%;
                flex-direction: row;
                justify-content: space-between;
            }
            
            .bans-container, .picks-container {
                width: 48%;
            }
            
            .pick-column {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .pick-slot {
                width: 180px;
                height: 180px;
                margin: 10px;
            }
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .team-indicator {
                width: 100%;
            }
            
            .side {
                flex-direction: column;
            }
            
            .bans-container, .picks-container {
                width: 100%;
            }
            
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
            
            .brawler-card {
                width: 80px;
                height: 80px;
            }
            
            .pick-slot {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">BS</div>
            <div class="logo-text">Brawl Stars Draft</div>
        </div>
        
        <div class="status-container">
            <div id="status">ОЖИДАНИЕ НАЧАЛА ДРАФТА</div>
            <div class="timer" id="timer">
                <span>Автосброс через: --:--</span>
            </div>
        </div>
        
        <div id="team-indicator" class="team-indicator team-spectator-indicator">
            Наблюдатель
        </div>
    </div>
    
    <!-- Основной контент -->
    <div class="main-content">
        <!-- Синяя команда -->
        <div class="side blue-side">
            <div class="side-header blue-header">Синяя команда</div>
            
            <div class="bans-container">
                <div class="section-title">
                    <span>БАНЫ</span>
                    <div id="blue-bans-count">0/3</div>
                </div>
                <div class="ban-row" id="blue-bans-ui">
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                </div>
            </div>
            
            <div class="picks-container">
                <div class="section-title">
                    <span>ПИКИ</span>
                    <div id="blue-picks-count">0/3</div>
                </div>
                <div class="pick-column" id="blue-picks-ui">
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                </div>
            </div>
        </div>
        
        <!-- Центр -->
        <div class="center">
            <div class="search-container">
                <div class="search-icon">🔍</div>
                <input type="text" id="search" placeholder="Поиск бравлера..." autocomplete="off">
            </div>
            
            <div class="grid-container">
                <div class="grid-header">
                    <div class="brawlers-count">
                        Всего: <span id="total-count">0</span> | 
                        Доступно: <span id="available-count">0</span>
                    </div>
                    
                    <div class="grid-controls">
                        <button class="grid-btn" onclick="sortBrawlers('name')">По имени</button>
                        <button class="grid-btn" onclick="sortBrawlers('available')">По доступности</button>
                    </div>
                </div>
                
                <div class="grid" id="grid">
                    <!-- Бравлеры загружаются динамически -->
                </div>
                
                <div class="controls">
                    <button class="control-btn start-btn" onclick="startDraft()">
                        <span>▶️</span>
                        НАЧАТЬ ДРАФТ
                    </button>
                    <button class="control-btn reset-btn" onclick="resetDraft()">
                        <span>🔄</span>
                        СБРОСИТЬ
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Красная команда -->
        <div class="side red-side">
            <div class="side-header red-header">Красная команда</div>
            
            <div class="bans-container">
                <div class="section-title">
                    <span>БАНЫ</span>
                    <div id="red-bans-count">0/3</div>
                </div>
                <div class="ban-row" id="red-bans-ui">
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                </div>
            </div>
            
            <div class="picks-container">
                <div class="section-title">
                    <span>ПИКИ</span>
                    <div id="red-picks-count">0/3</div>
                </div>
                <div class="pick-column" id="red-picks-ui">
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Уведомления -->
    <div id="notification-container"></div>
    
    <script>
        // Инициализация
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        let myTeam = urlParams.get('team') || 'spectator';
        
        let brawlers = [];
        let draftState = {
            phase: "waiting",
            current_turn: null,
            picking_team: null,
            pick_order: [],
            current_pick_index: 0
        };
        let resetCountdown = null;
        let currentSort = 'name';
        
        // Подключение к серверу
        socket.on('connect', function() {
            console.log('✅ Подключено к серверу');
            socket.emit('join', { team: myTeam });
            updateTeamIndicator();
        });
        
        // Установка команды
        socket.on('set_team', function(data) {
            myTeam = data.team;
            updateTeamIndicator();
            showNotification(`Вы присоединились как ${getTeamName(myTeam)}`);
        });
        
        // Получаем список бравлеров
        socket.on('brawlers_list', function(serverBrawlers) {
            console.log('📋 Получены бравлеры:', serverBrawlers.length);
            brawlers = serverBrawlers;
            renderBrawlersGrid();
            updateBrawlersCount();
        });
        
        // Обновление состояния драфта
        socket.on('update_draft', function(data) {
            console.log('🔄 Обновление драфта:', data.phase);
            draftState = data;
            updateUI();
            updateBrawlersCount();
            
            // Запускаем таймер для автосброса
            if (data.phase === "finished") {
                startResetCountdown();
            } else {
                if (resetCountdown) {
                    clearInterval(resetCountdown);
                    resetCountdown = null;
                    updateTimerDisplay(0);
                }
            }
        });
        
        // Сброс драфта
        socket.on('draft_reset', function() {
            showNotification('Драфт сброшен!');
            if (resetCountdown) {
                clearInterval(resetCountdown);
                resetCountdown = null;
                updateTimerDisplay(0);
            }
        });
        
        // Функции
        function updateTeamIndicator() {
            const indicator = document.getElementById('team-indicator');
            indicator.textContent = getTeamName(myTeam);
            indicator.className = 'team-indicator';
            
            if (myTeam === 'blue') {
                indicator.classList.add('team-blue-indicator');
            } else if (myTeam === 'red') {
                indicator.classList.add('team-red-indicator');
            } else {
                indicator.classList.add('team-spectator-indicator');
            }
        }
        
        function getTeamName(team) {
            switch(team) {
                case 'blue': return 'Синяя команда';
                case 'red': return 'Красная команда';
                default: return 'Наблюдатель';
            }
        }
        
        function startDraft() {
            if (myTeam === 'spectator') {
                showNotification('Только игроки могут начать драфт');
                return;
            }
            
            if (confirm('Начать новый драфт? Текущий прогресс будет сброшен.')) {
                socket.emit('start_draft');
            }
        }
        
        function resetDraft() {
            if (confirm('Сбросить текущий драфт?')) {
                socket.emit('reset_draft');
            }
        }
        
        function updateUI() {
            // Обновляем статус
            updateStatus();
            
            // Обновляем слоты команд
            updateTeamSlots('blue', draftState.blue_bans, draftState.blue_picks);
            updateTeamSlots('red', draftState.red_bans, draftState.red_picks);
            
            // Обновляем счетчики
            document.getElementById('blue-bans-count').textContent = `${draftState.blue_bans.length}/3`;
            document.getElementById('red-bans-count').textContent = `${draftState.red_bans.length}/3`;
            document.getElementById('blue-picks-count').textContent = `${draftState.blue_picks.length}/3`;
            document.getElementById('red-picks-count').textContent = `${draftState.red_picks.length}/3`;
            
            // Подсвечиваем активные слоты
            highlightActiveSlots();
            
            // Обновляем карточки бравлеров
            renderBrawlersGrid();
        }
        
        function updateStatus() {
            const statusEl = document.getElementById('status');
            
            switch(draftState.phase) {
                case 'waiting':
                    statusEl.textContent = 'ОЖИДАНИЕ НАЧАЛА ДРАФТА';
                    break;
                    
                case 'ban_blue':
                    statusEl.textContent = 'БАНИ: СИНЯЯ КОМАНДА';
                    break;
                    
                case 'ban_red':
                    statusEl.textContent = 'БАНИ: КРАСНАЯ КОМАНДА';
                    break;
                    
                case 'pick':
                    const currentPick = draftState.current_pick_index + 1;
                    const totalPicks = 6;
                    const teamTurn = draftState.current_turn === 'blue' ? 'СИНЯЯ' : 'КРАСНАЯ';
                    statusEl.textContent = `ПИК ${currentPick}/${totalPicks}: ${teamTurn} КОМАНДА`;
                    break;
                    
                case 'finished':
                    statusEl.textContent = 'ДРАФТ ЗАВЕРШЕН';
                    break;
                    
                default:
                    statusEl.textContent = draftState.phase;
            }
        }
        
        function updateTeamSlots(team, bans, picks) {
            const banSlots = document.querySelectorAll(`#${team}-bans-ui .ban-slot`);
            const pickSlots = document.querySelectorAll(`#${team}-picks-ui .pick-slot`);
            
            // Очищаем слоты
            banSlots.forEach(slot => {
                slot.innerHTML = '';
                slot.classList.remove('hidden');
            });
            
            pickSlots.forEach(slot => {
                slot.innerHTML = '';
                slot.classList.remove('active');
                if (team === 'red') {
                    slot.classList.remove('red');
                }
            });
            
            // Заполняем баны
            bans.forEach((brawler, index) => {
                if (index < banSlots.length) {
                    if (brawler === 'hidden') {
                        banSlots[index].classList.add('hidden');
                    } else {
                        const imgUrl = `/static/brawler_images/${brawler}.png`;
                        banSlots[index].innerHTML = `<img src="${imgUrl}" alt="${brawler}">`;
                    }
                }
            });
            
            // Заполняем пики
            picks.forEach((brawler, index) => {
                if (index < pickSlots.length) {
                    const imgUrl = `/static/brawler_images/${brawler}.png`;
                    pickSlots[index].innerHTML = `
                        <img src="${imgUrl}" alt="${brawler}">
                        <div class="slot-name">${brawler.toUpperCase()}</div>
                    `;
                }
            });
        }
        
        function highlightActiveSlots() {
            if (draftState.phase === 'pick') {
                const activeTeam = draftState.current_turn;
                const pickSlots = document.querySelectorAll(`#${activeTeam}-picks-ui .pick-slot`);
                
                // Находим следующий пустой слот
                let emptySlotIndex = 0;
                if (activeTeam === 'blue') {
                    emptySlotIndex = draftState.blue_picks.length;
                } else {
                    emptySlotIndex = draftState.red_picks.length;
                }
                
                if (emptySlotIndex < pickSlots.length) {
                    pickSlots[emptySlotIndex].classList.add('active');
                    if (activeTeam === 'red') {
                        pickSlots[emptySlotIndex].classList.add('red');
                    }
                }
            }
        }
        
        function renderBrawlersGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            if (!brawlers.length) {
                grid.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">Бравлеры не найдены</div>';
                return;
            }
            
            // Фильтруем и сортируем
            let filtered = [...brawlers];
            const searchQuery = document.getElementById('search').value.toLowerCase();
            if (searchQuery) {
                filtered = filtered.filter(b => b.toLowerCase().includes(searchQuery));
            }
            
            if (currentSort === 'name') {
                filtered.sort((a, b) => a.localeCompare(b));
            } else if (currentSort === 'available') {
                // Сначала доступные, потом выбранные
                filtered.sort((a, b) => {
                    const aSelected = draftState.all_selected.includes(a);
                    const bSelected = draftState.all_selected.includes(b);
                    if (aSelected && !bSelected) return 1;
                    if (!aSelected && bSelected) return -1;
                    return a.localeCompare(b);
                });
            }
            
            // Создаем карточки
            filtered.forEach(brawler => {
                const card = document.createElement('div');
                card.className = 'brawler-card';
                card.id = `card-${brawler}`;
                
                const isSelected = draftState.all_selected.includes(brawler);
                if (isSelected) {
                    card.classList.add('disabled');
                }
                
                const imgUrl = `/static/brawler_images/${brawler}.png`;
                card.innerHTML = `
                    <div class="brawler-img-container">
                        <img src="${imgUrl}" alt="${brawler}" 
                             onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100\" height=\"100\"><rect width=\"100\" height=\"100\" fill=\"%23222\"/><text x=\"50\" y=\"50\" font-family=\"Arial\" font-size=\"14\" fill=\"white\" text-anchor=\"middle\" dy=\".3em\">${brawler.charAt(0)}</text></svg>'">
                    </div>
                    <div class="brawler-name">${brawler}</div>
                `;
                
                card.onclick = () => {
                    if (myTeam === 'spectator') {
                        showNotification('Только игроки могут выбирать бравлеров');
                        return;
                    }
                    
                    if (isSelected) {
                        showNotification('Этот бравлер уже выбран');
                        return;
                    }
                    
                    if (draftState.phase === 'waiting') {
                        showNotification('Дождитесь начала драфта');
                        return;
                    }
                    
                    if (draftState.phase === 'finished') {
                        showNotification('Драфт завершен');
                        return;
                    }
                    
                    // Проверяем, может ли команда выбрать сейчас
                    if (draftState.phase.includes('ban') && draftState.current_turn !== myTeam) {
                        showNotification('Не ваша очередь банить');
                        return;
                    }
                    
                    if (draftState.phase === 'pick' && draftState.current_turn !== myTeam) {
                        showNotification('Не ваша очередь пикать');
                        return;
                    }
                    
                    socket.emit('select_brawler', {
                        brawler: brawler,
                        team: myTeam
                    });
                };
                
                grid.appendChild(card);
            });
        }
        
        function updateBrawlersCount() {
            const total = brawlers.length;
            const available = total - (draftState.all_selected?.length || 0);
            
            document.getElementById('total-count').textContent = total;
            document.getElementById('available-count').textContent = available;
        }
        
        function sortBrawlers(sortType) {
            currentSort = sortType;
            renderBrawlersGrid();
        }
        
        function startResetCountdown() {
            if (resetCountdown) {
                clearInterval(resetCountdown);
            }
            
            let secondsLeft = 60;
            updateTimerDisplay(secondsLeft);
            
            resetCountdown = setInterval(() => {
                secondsLeft--;
                updateTimerDisplay(secondsLeft);
                
                if (secondsLeft <= 0) {
                    clearInterval(resetCountdown);
                    resetCountdown = null;
                }
            }, 1000);
        }
        
        function updateTimerDisplay(secondsLeft) {
            const timerEl = document.getElementById('timer');
            
            if (secondsLeft > 0) {
                const mins = Math.floor(secondsLeft / 60);
                const secs = secondsLeft % 60;
                timerEl.innerHTML = `<span>Автосброс через: ${mins}:${secs.toString().padStart(2, '0')}</span>`;
                
                if (secondsLeft <= 10) {
                    timerEl.style.color = '#e74c3c';
                } else if (secondsLeft <= 30) {
                    timerEl.style.color = '#f39c12';
                } else {
                    timerEl.style.color = '#95a5a6';
                }
            } else {
                timerEl.innerHTML = '<span>Автосброс через: --:--</span>';
                timerEl.style.color = '#95a5a6';
            }
        }
        
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            notification.className = 'notification';
            
            let icon = 'ℹ️';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '❌';
            if (type === 'warning') icon = '⚠️';
            
            notification.innerHTML = `
                <span>${icon}</span>
                <span>${message}</span>
            `;
            
            container.appendChild(notification);
            
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 5000);
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            // Поиск
            document.getElementById('search').addEventListener('input', function() {
                renderBrawlersGrid();
            });
            
            // Показываем инструкцию
            setTimeout(() => {
                if (myTeam === 'spectator') {
                    showNotification('Для игры добавьте ?team=blue или ?team=red к URL');
                }
            }, 1000);
        });
    </script>
</body>
</html>
