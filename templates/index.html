<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Draft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f0f0f; 
            color: white; 
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header { 
            background: #1a1a1a; 
            padding: 20px; 
            text-align: center; 
            font-size: 24px; 
            font-weight: bold;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #333;
            position: relative;
        }
        
        .timer {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #f39c12;
            font-size: 16px;
        }
        
        /* Меню выбора карты (для админа) */
        .map-selector {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #f39c12;
            display: none;
        }
        
        .map-selector.active {
            display: block;
        }
        
        .map-selector-title {
            color: #f39c12;
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .modes-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .mode-tab {
            padding: 10px 20px;
            background: #333;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        
        .mode-tab:hover {
            background: #444;
        }
        
        .mode-tab.active {
            background: #3498db;
            border-color: #3498db;
        }
        
        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 8px;
        }
        
        .map-option {
            background: #333;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }
        
        .map-option:hover {
            transform: translateY(-3px);
            border-color: #3498db;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        .map-option.selected {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
        }
        
        .map-option-image {
            width: 100%;
            height: 120px;
            overflow: hidden;
        }
        
        .map-option-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .map-option-name {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
        
        /* Карта и режим */
        .map-display {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            min-height: 250px;
        }
        
        .map-container {
            text-align: center;
        }
        
        .map-name {
            font-size: 24px;
            font-weight: bold;
            color: #2ecc71;
            margin-bottom: 15px;
        }
        
        .map-image {
            width: 400px;
            height: 225px;
            background: #333;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid #444;
        }
        
        .map-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .mode-container {
            text-align: center;
        }
        
        .mode-name {
            font-size: 20px;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 15px;
        }
        
        .mode-icon {
            width: 120px;
            height: 120px;
            background: #333;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .mode-icon img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        
        /* Основной контент драфта */
        .draft-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .team-side {
            width: 350px;
            background: #222; 
            padding: 20px; 
            border-radius: 10px;
            border: 3px solid;
            display: flex;
            flex-direction: column;
        }
        
        .team-blue { border-color: #3498db; }
        .team-red { border-color: #e74c3c; }
        
        .team-header {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid;
        }
        
        .team-blue .team-header { color: #3498db; border-color: #3498db; }
        .team-red .team-header { color: #e74c3c; border-color: #e74c3c; }
        
        .ready-section {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .ready-status {
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .ready-status.ready {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 2px solid #2ecc71;
        }
        
        .ready-status.not-ready {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 2px solid #e74c3c;
        }
        
        .ready-btn {
            padding: 12px 24px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        
        .ready-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }
        
        .ready-btn.unready {
            background: #e74c3c;
        }
        
        .bans-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .ban-slot {
            width: 80px;
            height: 80px;
            background: #444;
            border: 3px dashed #666;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #666;
            font-weight: bold;
        }
        
        .ban-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) brightness(0.6);
        }
        
        .pick-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        
        .pick-slot {
            width: 200px;
            height: 200px;
            background: #444;
            border: 4px solid #666;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .pick-slot.active {
            border-color: #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(46, 204, 113, 0.5); }
            50% { box-shadow: 0 0 30px rgba(46, 204, 113, 0.8); }
        }
        
        .pick-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .slot-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        /* Панель бравлеров */
        .brawlers-panel {
            flex: 1;
            background: #222;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
        }
        
        .search-box {
            padding: 15px;
            background: #333;
            border: 2px solid #444;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .brawlers-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            overflow-y: auto;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 8px;
            max-height: 400px;
        }
        
        .brawler-card {
            width: 100px;
            height: 100px;
            background: #333;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid transparent;
            transition: 0.3s;
        }
        
        .brawler-card:hover {
            transform: scale(1.05);
            border-color: #3498db;
        }
        
        .brawler-card.disabled {
            opacity: 0.3;
            filter: grayscale(1);
            cursor: not-allowed;
        }
        
        .brawler-card img {
            width: 100%;
            height: 70px;
            object-fit: contain;
            padding: 5px;
        }
        
        .brawler-name {
            height: 30px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .admin-controls {
            margin-top: 20px;
            text-align: center;
        }
        
        .admin-btn {
            padding: 12px 24px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #3498db;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.5s, fadeOut 0.5s 2.7s forwards;
            max-width: 300px;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
        
        @media (max-width: 1200px) {
            .draft-container {
                flex-direction: column;
            }
            
            .team-side {
                width: 100%;
                flex-direction: row;
                justify-content: space-around;
            }
            
            .ready-section, .bans-row, .pick-column {
                width: 30%;
            }
        }
        
        @media (max-width: 768px) {
            .map-display {
                flex-direction: column;
                gap: 20px;
            }
            
            .map-image {
                width: 100%;
                max-width: 400px;
            }
            
            .team-side {
                flex-direction: column;
            }
            
            .ready-section, .bans-row, .pick-column {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <div id="status">Brawl Stars Draft</div>
            <div class="timer" id="timer"></div>
        </div>
        
        <!-- Меню выбора карты (только для админа) -->
        <div id="map-selector" class="map-selector">
            <div class="map-selector-title">ВЫБОР КАРТЫ</div>
            
            <div class="modes-tabs" id="modes-tabs">
                <!-- Вкладки режимов будут добавлены здесь -->
            </div>
            
            <div class="maps-grid" id="maps-grid">
                <!-- Карты будут добавлены здесь -->
            </div>
            
            <div class="admin-controls">
                <button class="admin-btn" onclick="resetDraft()">СБРОСИТЬ ДРАФТ</button>
            </div>
        </div>
        
        <!-- Отображение выбранной карты -->
        <div class="map-display">
            <div class="map-container">
                <div id="map-name" class="map-name">Ожидание выбора карты</div>
                <div class="map-image">
                    <img id="map-image" src="" alt="Выбранная карта">
                </div>
            </div>
            
            <div class="mode-container">
                <div id="mode-name" class="mode-name">Режим</div>
                <div class="mode-icon">
                    <img id="mode-icon" src="" alt="Иконка режима">
                </div>
            </div>
        </div>
        
        <!-- Основной контент драфта -->
        <div class="draft-container">
            <!-- Синяя команда -->
            <div class="team-side team-blue">
                <div class="team-header">СИНЯЯ КОМАНДА</div>
                
                <div class="ready-section">
                    <div id="blue-ready-status" class="ready-status not-ready">НЕ ГОТОВ</div>
                    <button id="blue-ready-btn" class="ready-btn" onclick="toggleReady('blue')">ГОТОВ</button>
                </div>
                
                <div class="bans-row" id="blue-bans">
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                </div>
                
                <div class="pick-column" id="blue-picks">
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                </div>
            </div>
            
            <!-- Панель бравлеров -->
            <div class="brawlers-panel">
                <input type="text" class="search-box" id="search" placeholder="Поиск бравлера..." autocomplete="off">
                <div class="brawlers-grid" id="brawlers-grid">
                    <!-- Бравлеры будут загружены здесь -->
                </div>
            </div>
            
            <!-- Красная команда -->
            <div class="team-side team-red">
                <div class="team-header">КРАСНАЯ КОМАНДА</div>
                
                <div class="ready-section">
                    <div id="red-ready-status" class="ready-status not-ready">НЕ ГОТОВ</div>
                    <button id="red-ready-btn" class="ready-btn" onclick="toggleReady('red')">ГОТОВ</button>
                </div>
                
                <div class="bans-row" id="red-bans">
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                    <div class="ban-slot"></div>
                </div>
                
                <div class="pick-column" id="red-picks">
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                    <div class="pick-slot"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Уведомления -->
    <div id="notification-container"></div>
    
    <script>
        // Конфигурация
        const ADMIN_SECRET = 'BS-DRAFT-ADMIN-2024-SUPER-SECRET-KEY';
        let currentTeam = null;
        let isAdmin = false;
        let draftState = null;
        let brawlers = [];
        let maps = {};
        let modes = [];
        let autoResetTimer = null;
        let selectedMode = null;
        let selectedMap = null;
        
        // Инициализация
        function init() {
            // Определяем команду из URL
            const urlParams = new URLSearchParams(window.location.search);
            const teamParam = urlParams.get('team');
            const adminParam = urlParams.get('admin');
            
            // Проверяем админский доступ
            if (adminParam === ADMIN_SECRET) {
                isAdmin = true;
                document.getElementById('map-selector').classList.add('active');
                showNotification('Вы вошли как администратор', 'success');
            }
            
            // Определяем команду
            if (teamParam === 'blue' || teamParam === 'red') {
                currentTeam = teamParam;
                showNotification(`Вы играете за ${currentTeam === 'blue' ? 'синюю' : 'красную'} команду`, 'success');
            } else {
                showNotification('Вы наблюдатель', 'info');
            }
            
            // Загружаем начальное состояние
            loadState();
            
            // Загружаем карты для админа
            if (isAdmin) {
                loadMaps();
            }
            
            // Настраиваем поиск
            document.getElementById('search').addEventListener('input', renderBrawlers);
            
            // Автообновление состояния
            setInterval(loadState, 2000);
        }
        
        async function loadState() {
            try {
                const response = await fetch(`/api/state${currentTeam ? `?team=${currentTeam}` : ''}`);
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    brawlers = data.brawlers || [];
                    updateUI();
                    renderBrawlers();
                }
            } catch (error) {
                console.error('Ошибка загрузки состояния:', error);
            }
        }
        
        async function loadMaps() {
            if (!isAdmin) return;
            
            try {
                const response = await fetch('/api/maps');
                const data = await response.json();
                
                if (data.success) {
                    maps = data.maps || {};
                    modes = data.modes || [];
                    renderModesTabs();
                    renderMapsForMode(Object.keys(maps)[0] || 'Heist');
                }
            } catch (error) {
                console.error('Ошибка загрузки карт:', error);
            }
        }
        
        function renderModesTabs() {
            const tabsContainer = document.getElementById('modes-tabs');
            tabsContainer.innerHTML = '';
            
            Object.keys(maps).forEach(mode => {
                const tab = document.createElement('div');
                tab.className = `mode-tab ${selectedMode === mode ? 'active' : ''}`;
                tab.textContent = mode.replace('_', ' ');
                tab.onclick = () => {
                    selectedMode = mode;
                    renderModesTabs();
                    renderMapsForMode(mode);
                };
                
                tabsContainer.appendChild(tab);
            });
            
            // Активируем первую вкладку если не выбрана
            if (!selectedMode && Object.keys(maps).length > 0) {
                selectedMode = Object.keys(maps)[0];
                document.querySelector('.mode-tab').classList.add('active');
                renderMapsForMode(selectedMode);
            }
        }
        
        function renderMapsForMode(mode) {
            const mapsGrid = document.getElementById('maps-grid');
            mapsGrid.innerHTML = '';
            
            if (!maps[mode]) return;
            
            maps[mode].forEach(map => {
                const mapOption = document.createElement('div');
                mapOption.className = 'map-option';
                if (selectedMap && selectedMap.name === map.name && selectedMap.mode === map.mode) {
                    mapOption.classList.add('selected');
                }
                
                mapOption.innerHTML = `
                    <div class="map-option-image">
                        <img src="${map.path}" alt="${map.name}">
                    </div>
                    <div class="map-option-name">${map.name}</div>
                `;
                
                mapOption.onclick = () => selectMap(map.name, map.mode);
                mapsGrid.appendChild(mapOption);
            });
        }
        
        async function selectMap(mapName, mapMode) {
            if (!isAdmin) return;
            
            try {
                const response = await fetch('/api/select-map', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        admin_key: ADMIN_SECRET,
                        map_name: mapName,
                        map_mode: mapMode
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    selectedMap = { name: mapName, mode: mapMode };
                    renderMapsForMode(mapMode);
                    showNotification(`Карта "${mapName}" выбрана`, 'success');
                    loadState();
                } else {
                    showNotification(data.error || 'Ошибка выбора карты', 'error');
                }
            } catch (error) {
                console.error('Ошибка выбора карты:', error);
                showNotification('Ошибка выбора карты', 'error');
            }
        }
        
        async function toggleReady(team) {
            if (!currentTeam || currentTeam !== team) {
                showNotification('Вы не можете управлять готовностью другой команды', 'error');
                return;
            }
            
            const isReady = team === 'blue' ? 
                (draftState?.blue_ready || false) : 
                (draftState?.red_ready || false);
            
            try {
                const endpoint = isReady ? '/api/unready' : '/api/ready';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ team: team })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    showNotification(isReady ? 'Готовность сброшена' : 'Вы готовы!', 'success');
                } else {
                    showNotification(data.error || 'Ошибка', 'error');
                }
            } catch (error) {
                console.error('Ошибка изменения готовности:', error);
                showNotification('Ошибка изменения готовности', 'error');
            }
        }
        
        async function resetDraft() {
            if (!isAdmin) {
                showNotification('Только администратор может сбросить драфт', 'error');
                return;
            }
            
            if (!confirm('Вы уверены, что хотите сбросить драфт? Все текущие выборы будут потеряны.')) {
                return;
            }
            
            try {
                const response = await fetch('/api/reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        admin_key: ADMIN_SECRET
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    renderBrawlers();
                    showNotification('Драфт сброшен', 'success');
                    
                    if (autoResetTimer) {
                        clearInterval(autoResetTimer);
                        autoResetTimer = null;
                    }
                }
            } catch (error) {
                console.error('Ошибка сброса драфта:', error);
                showNotification('Ошибка сброса драфта', 'error');
            }
        }
        
        async function selectBrawler(brawler) {
            if (!currentTeam) {
                showNotification('Наблюдатели не могут выбирать бравлеров', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/select-brawler', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        brawler: brawler,
                        team: currentTeam
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    renderBrawlers();
                } else {
                    if (data.auto_reset) {
                        showNotification('Драфт был автоматически сброшен через 1 минуту', 'info');
                        loadState();
                    } else {
                        showNotification(data.error || 'Ошибка выбора', 'error');
                    }
                }
            } catch (error) {
                console.error('Ошибка выбора бравлера:', error);
                showNotification('Ошибка выбора бравлера', 'error');
            }
        }
        
        function updateUI() {
            if (!draftState) return;
            
            // Обновляем статус
            updateStatus();
            
            // Обновляем отображение карты
            updateMapDisplay();
            
            // Обновляем готовность команд
            updateReadyStatus();
            
            // Обновляем слоты команд
            updateTeamSlots('blue', draftState.blue_bans, draftState.blue_picks);
            updateTeamSlots('red', draftState.red_bans, draftState.red_picks);
            
            // Обновляем таймер автосброса
            updateAutoResetTimer();
        }
        
        function updateStatus() {
            const statusEl = document.getElementById('status');
            
            switch(draftState.phase) {
                case 'waiting':
                    if (draftState.selected_map) {
                        if (draftState.blue_ready && draftState.red_ready) {
                            statusEl.textContent = 'ОЖИДАНИЕ НАЧАЛА ДРАФТА';
                        } else {
                            const readyCount = (draftState.blue_ready ? 1 : 0) + (draftState.red_ready ? 1 : 0);
                            statusEl.textContent = `ГОТОВНОСТЬ: ${readyCount}/2 КОМАНД`;
                        }
                    } else {
                        statusEl.textContent = 'ОЖИДАНИЕ ВЫБОРА КАРТЫ АДМИНОМ';
                    }
                    break;
                    
                case 'ban_blue':
                    statusEl.textContent = 'БАНИ: СИНЯЯ КОМАНДА';
                    break;
                    
                case 'ban_red':
                    statusEl.textContent = 'БАНИ: КРАСНАЯ КОМАНДА';
                    break;
                    
                case 'pick':
                    const currentPick = draftState.current_pick_index + 1;
                    const teamTurn = draftState.current_turn === 'blue' ? 'СИНЯЯ' : 'КРАСНАЯ';
                    statusEl.textContent = `ПИК ${currentPick}/6: ${teamTurn} КОМАНДА`;
                    break;
                    
                case 'finished':
                    statusEl.textContent = 'ДРАФТ ЗАВЕРШЕН';
                    break;
            }
        }
        
        function updateMapDisplay() {
            const mapNameEl = document.getElementById('map-name');
            const mapImageEl = document.getElementById('map-image');
            const modeNameEl = document.getElementById('mode-name');
            const modeIconEl = document.getElementById('mode-icon');
            
            if (draftState.selected_map) {
                mapNameEl.textContent = draftState.selected_map.name;
                mapImageEl.src = draftState.selected_map.path || '/static/placeholder.png';
                mapImageEl.alt = draftState.selected_map.name;
                
                modeNameEl.textContent = draftState.selected_mode || draftState.selected_map.mode;
                modeIconEl.src = `/static/modes/${draftState.selected_mode || draftState.selected_map.mode}.png`;
                modeIconEl.alt = draftState.selected_mode || draftState.selected_map.mode;
            } else {
                mapNameEl.textContent = 'Ожидание выбора карты';
                mapImageEl.src = '/static/placeholder.png';
                mapImageEl.alt = 'Карта не выбрана';
                modeNameEl.textContent = 'Режим';
                modeIconEl.src = '';
            }
        }
        
        function updateReadyStatus() {
            // Синяя команда
            const blueReadyStatus = document.getElementById('blue-ready-status');
            const blueReadyBtn = document.getElementById('blue-ready-btn');
            
            if (draftState.blue_ready) {
                blueReadyStatus.textContent = 'ГОТОВ';
                blueReadyStatus.className = 'ready-status ready';
                blueReadyBtn.textContent = 'ОТМЕНИТЬ';
                blueReadyBtn.classList.add('unready');
            } else {
                blueReadyStatus.textContent = 'НЕ ГОТОВ';
                blueReadyStatus.className = 'ready-status not-ready';
                blueReadyBtn.textContent = 'ГОТОВ';
                blueReadyBtn.classList.remove('unready');
            }
            
            // Красная команда
            const redReadyStatus = document.getElementById('red-ready-status');
            const redReadyBtn = document.getElementById('red-ready-btn');
            
            if (draftState.red_ready) {
                redReadyStatus.textContent = 'ГОТОВ';
                redReadyStatus.className = 'ready-status ready';
                redReadyBtn.textContent = 'ОТМЕНИТЬ';
                redReadyBtn.classList.add('unready');
            } else {
                redReadyStatus.textContent = 'НЕ ГОТОВ';
                redReadyStatus.className = 'ready-status not-ready';
                redReadyBtn.textContent = 'ГОТОВ';
                redReadyBtn.classList.remove('unready');
            }
        }
        
        function updateTeamSlots(team, bans, picks) {
            const banSlots = document.querySelectorAll(`#${team}-bans .ban-slot`);
            const pickSlots = document.querySelectorAll(`#${team}-picks .pick-slot`);
            
            // Баны
            bans.forEach((brawler, index) => {
                if (index < banSlots.length) {
                    if (brawler === 'hidden') {
                        banSlots[index].textContent = '?';
                        banSlots[index].style.background = '#333';
                    } else {
                        const imgUrl = `/static/brawler_images/${brawler}.png`;
                        banSlots[index].innerHTML = `<img src="${imgUrl}" alt="${brawler}">`;
                        banSlots[index].style.background = '#444';
                    }
                }
            });
            
            // Пики
            picks.forEach((brawler, index) => {
                if (index < pickSlots.length) {
                    const imgUrl = `/static/brawler_images/${brawler}.png`;
                    pickSlots[index].innerHTML = `
                        <img src="${imgUrl}" alt="${brawler}">
                        <div class="slot-name">${brawler.toUpperCase()}</div>
                    `;
                    pickSlots[index].classList.remove('active');
                }
            });
            
            // Подсвечиваем активный слот
            if (draftState.phase === 'pick' && draftState.current_turn === team) {
                const emptyIndex = team === 'blue' ? draftState.blue_picks.length : draftState.red_picks.length;
                if (emptyIndex < pickSlots.length) {
                    pickSlots[emptyIndex].classList.add('active');
                }
            }
        }
        
        function renderBrawlers() {
            const grid = document.getElementById('brawlers-grid');
            grid.innerHTML = '';
            
            if (!brawlers.length) {
                grid.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">Загрузка бравлеров...</div>';
                return;
            }
            
            // Фильтрация по поиску
            const searchQuery = document.getElementById('search').value.toLowerCase();
            
            brawlers.forEach(brawler => {
                const isSelected = draftState?.all_selected?.includes(brawler) || false;
                
                // Проверяем поиск
                if (searchQuery && !brawler.toLowerCase().includes(searchQuery)) {
                    return;
                }
                
                const card = document.createElement('div');
                card.className = `brawler-card ${isSelected ? 'disabled' : ''}`;
                card.innerHTML = `
                    <img src="/static/brawler_images/${brawler}.png" alt="${brawler}">
                    <div class="brawler-name">${brawler}</div>
                `;
                
                if (!isSelected && currentTeam && draftState.phase !== 'waiting' && draftState.phase !== 'finished') {
                    card.onclick = () => selectBrawler(brawler);
                }
                
                grid.appendChild(card);
            });
        }
        
        function updateAutoResetTimer() {
            const timerEl = document.getElementById('timer');
            
            if (draftState.phase === 'finished' && draftState.reset_in) {
                let secondsLeft = draftState.reset_in;
                timerEl.textContent = `Автосброс через: ${secondsLeft} сек`;
                
                if (autoResetTimer) {
                    clearInterval(autoResetTimer);
                }
                
                autoResetTimer = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft > 0) {
                        timerEl.textContent = `Автосброс через: ${secondsLeft} сек`;
                    } else {
                        clearInterval(autoResetTimer);
                        autoResetTimer = null;
                        timerEl.textContent = '';
                        loadState();
                    }
                }, 1000);
            } else {
                timerEl.textContent = '';
                if (autoResetTimer) {
                    clearInterval(autoResetTimer);
                    autoResetTimer = null;
                }
            }
        }
        
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            notification.className = 'notification';
            if (type === 'error') notification.style.background = '#e74c3c';
            if (type === 'success') notification.style.background = '#2ecc71';
            notification.textContent = message;
            
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // Запускаем при загрузке
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
