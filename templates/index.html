<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Draft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a14 0%, #1a1a2a 100%);
            color: white;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        /* Шапка */
        .header {
            background: linear-gradient(90deg, #1a1a1a 0%, #2a2a3a 100%);
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 3px solid #3498db;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3498db, #e74c3c);
        }
        
        .team-indicator {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .team-blue-indicator {
            background: linear-gradient(135deg, #3498db, #2980b9);
            border: 2px solid #3498db;
        }
        
        .team-red-indicator {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: 2px solid #e74c3c;
        }
        
        .timer {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            font-size: 16px;
            color: #f39c12;
            font-weight: bold;
        }
        
        /* Карта и режим */
        .map-section {
            background: rgba(26, 26, 42, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            min-height: 300px;
        }
        
        .map-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .map-name {
            font-size: 24px;
            font-weight: bold;
            color: #2ecc71;
            text-align: center;
            text-transform: uppercase;
        }
        
        .map-image {
            width: 400px;
            height: 225px;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        .map-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .mode-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .mode-name {
            font-size: 20px;
            font-weight: bold;
            color: #3498db;
            text-transform: uppercase;
        }
        
        .mode-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #3498db;
            background: rgba(52, 152, 219, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .mode-icon img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        
        /* Панель админа */
        .admin-panel {
            background: rgba(26, 26, 42, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 3px solid #f39c12;
            display: none;
        }
        
        .admin-panel.active {
            display: block;
        }
        
        .admin-title {
            color: #f39c12;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .map-option {
            background: rgba(40, 40, 60, 0.8);
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            text-align: center;
        }
        
        .map-option:hover {
            transform: translateY(-3px);
            border-color: #3498db;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        .map-option.selected {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
        }
        
        .map-option-image {
            width: 100%;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .map-option-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .map-option-name {
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .map-option-mode {
            font-size: 10px;
            color: #3498db;
            font-weight: bold;
        }
        
        .admin-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .admin-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }
        
        .admin-btn.reset {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        
        /* Основной контент драфта */
        .draft-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .team-side {
            width: 350px;
            background: rgba(26, 26, 42, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 3px solid;
            display: flex;
            flex-direction: column;
        }
        
        .team-blue {
            border-color: #3498db;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.3);
        }
        
        .team-red {
            border-color: #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.3);
        }
        
        .team-header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid;
        }
        
        .team-blue .team-header {
            color: #3498db;
            border-color: #3498db;
        }
        
        .team-red .team-header {
            color: #e74c3c;
            border-color: #e74c3c;
        }
        
        .ready-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }
        
        .ready-indicator.ready {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 2px solid #2ecc71;
        }
        
        .ready-indicator.not-ready {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 2px solid #e74c3c;
        }
        
        .ready-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-bottom: 20px;
        }
        
        .ready-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }
        
        .ready-btn.unready {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        
        .section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .bans-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .ban-slot {
            width: 80px;
            height: 80px;
            background: rgba(40, 40, 60, 0.8);
            border: 3px dashed #666;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #666;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .ban-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) brightness(0.6);
        }
        
        .ban-slot.hidden {
            background: #333;
        }
        
        .picks-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        
        .pick-slot {
            width: 200px;
            height: 200px;
            background: rgba(40, 40, 60, 0.8);
            border: 4px solid #666;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .pick-slot.active {
            border-color: #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(46, 204, 113, 0.5); }
            50% { box-shadow: 0 0 30px rgba(46, 204, 113, 0.8); }
        }
        
        .pick-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .slot-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        /* Панель бравлеров */
        .brawlers-panel {
            flex: 1;
            background: rgba(26, 26, 42, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #444;
            display: flex;
            flex-direction: column;
        }
        
        .search-box {
            padding: 15px;
            background: rgba(40, 40, 60, 0.8);
            border: 2px solid #444;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .brawlers-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(20, 20, 30, 0.5);
            border-radius: 8px;
            max-height: 400px;
        }
        
        .brawler-card {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.1), rgba(231, 76, 60, 0.1));
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .brawler-card:hover {
            transform: translateY(-5px);
            border-color: #3498db;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        .brawler-card.disabled {
            opacity: 0.3;
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none !important;
        }
        
        .brawler-card img {
            width: 100%;
            height: 70px;
            object-fit: contain;
            padding: 8px;
        }
        
        .brawler-name {
            height: 30px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Уведомления */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.5s, fadeOut 0.5s 2.7s forwards;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            max-width: 300px;
        }
        
        .notification.error {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        
        .notification.success {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
        
        /* Адаптивность */
        @media (max-width: 1200px) {
            .draft-container {
                flex-direction: column;
            }
            
            .team-side {
                width: 100%;
                flex-direction: row;
                justify-content: space-around;
            }
            
            .section {
                width: 45%;
            }
        }
        
        @media (max-width: 768px) {
            .header {
                font-size: 20px;
                padding: 15px;
            }
            
            .team-indicator, .timer {
                position: static;
                transform: none;
                margin-top: 10px;
            }
            
            .map-section {
                flex-direction: column;
                gap: 20px;
            }
            
            .map-image {
                width: 100%;
                max-width: 400px;
            }
            
            .team-side {
                flex-direction: column;
            }
            
            .section {
                width: 100%;
            }
            
            .brawlers-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
            
            .brawler-card {
                width: 80px;
                height: 80px;
            }
            
            .brawler-card img {
                height: 55px;
            }
            
            .brawler-name {
                height: 25px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header" id="header">
            <div id="status">Brawl Stars Draft</div>
            <div id="timer" class="timer"></div>
            <div id="team-indicator" class="team-indicator"></div>
        </div>
        
        <!-- Панель админа -->
        <div id="admin-panel" class="admin-panel">
            <div class="admin-title">ПАНЕЛЬ АДМИНИСТРАТОРА</div>
            <div id="maps-container" class="maps-grid"></div>
            <div class="admin-controls">
                <button class="admin-btn" onclick="resetDraft()">СБРОСИТЬ ДРАФТ</button>
            </div>
        </div>
        
        <!-- Карта и режим -->
        <div id="map-section" class="map-section">
            <div class="map-container">
                <div id="map-name" class="map-name">Выберите карту</div>
                <div class="map-image">
                    <img id="map-image" src="" alt="Выбранная карта">
                </div>
            </div>
            <div class="mode-container">
                <div id="mode-name" class="mode-name">Режим</div>
                <div class="mode-icon">
                    <img id="mode-icon" src="" alt="Режим">
                </div>
            </div>
        </div>
        
        <!-- Основной контент драфта -->
        <div class="draft-container">
            <!-- Синяя команда -->
            <div id="blue-side" class="team-side team-blue">
                <div class="team-header">СИНЯЯ КОМАНДА</div>
                
                <div id="blue-ready-indicator" class="ready-indicator not-ready">
                    <span>Не готов</span>
                </div>
                
                <button id="blue-ready-btn" class="ready-btn" onclick="toggleReady('blue')">
                    ГОТОВ
                </button>
                
                <div class="section">
                    <div class="section-title">БАНЫ (3)</div>
                    <div class="bans-row" id="blue-bans">
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">ПИКИ (3)</div>
                    <div class="picks-column" id="blue-picks">
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                    </div>
                </div>
            </div>
            
            <!-- Панель бравлеров -->
            <div class="brawlers-panel">
                <input type="text" id="search" class="search-box" placeholder="Поиск бравлера..." autocomplete="off">
                <div class="brawlers-grid" id="brawlers-grid"></div>
            </div>
            
            <!-- Красная команда -->
            <div id="red-side" class="team-side team-red">
                <div class="team-header">КРАСНАЯ КОМАНДА</div>
                
                <div id="red-ready-indicator" class="ready-indicator not-ready">
                    <span>Не готов</span>
                </div>
                
                <button id="red-ready-btn" class="ready-btn" onclick="toggleReady('red')">
                    ГОТОВ
                </button>
                
                <div class="section">
                    <div class="section-title">БАНЫ (3)</div>
                    <div class="bans-row" id="red-bans">
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">ПИКИ (3)</div>
                    <div class="picks-column" id="red-picks">
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Уведомления -->
    <div id="notification-container"></div>
    
    <script>
        // Конфигурация
        const ADMIN_SECRET = 'BS-DRAFT-ADMIN-2024-SUPER-SECRET-KEY';
        let currentTeam = null;
        let isAdmin = false;
        let draftState = null;
        let brawlers = [];
        let maps = {};
        let modes = [];
        let autoResetTimer = null;
        let stateUpdateInterval = null;
        let selectedMapOption = null;
        
        // Инициализация
        function init() {
            // Определяем команду из URL
            const urlParams = new URLSearchParams(window.location.search);
            const teamParam = urlParams.get('team');
            const adminParam = urlParams.get('admin');
            
            // Проверяем админский доступ
            if (adminParam === ADMIN_SECRET) {
                isAdmin = true;
                document.getElementById('admin-panel').classList.add('active');
                showNotification('Вы вошли как администратор', 'success');
            }
            
            // Определяем команду
            if (teamParam === 'blue' || teamParam === 'red') {
                currentTeam = teamParam;
                updateTeamIndicator();
                showNotification(`Вы играете за ${currentTeam === 'blue' ? 'синюю' : 'красную'} команду`, 'success');
            } else {
                showNotification('Вы наблюдатель', 'info');
            }
            
            // Загружаем начальное состояние
            loadState();
            loadMaps();
            
            // Настраиваем интервалы обновления
            stateUpdateInterval = setInterval(loadState, 2000);
            setInterval(checkAutoReset, 5000);
            
            // Настраиваем поиск
            document.getElementById('search').addEventListener('input', renderBrawlers);
        }
        
        function updateTeamIndicator() {
            const indicator = document.getElementById('team-indicator');
            if (currentTeam === 'blue') {
                indicator.textContent = 'СИНЯЯ КОМАНДА';
                indicator.className = 'team-indicator team-blue-indicator';
            } else if (currentTeam === 'red') {
                indicator.textContent = 'КРАСНАЯ КОМАНДА';
                indicator.className = 'team-indicator team-red-indicator';
            } else {
                indicator.textContent = 'НАБЛЮДАТЕЛЬ';
                indicator.className = 'team-indicator';
            }
        }
        
        async function loadState() {
            try {
                const response = await fetch(`/api/state${currentTeam ? `?team=${currentTeam}` : ''}`);
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    brawlers = data.brawlers || [];
                    updateUI();
                    renderBrawlers();
                    
                    // Если мы админ и есть карты, загружаем их
                    if (isAdmin && data.maps && Object.keys(data.maps).length > 0) {
                        maps = data.maps;
                        modes = data.modes || [];
                        if (!selectedMapOption) {
                            renderMaps();
                        }
                    }
                }
            } catch (error) {
                console.error('Ошибка загрузки состояния:', error);
            }
        }
        
        async function loadMaps() {
            if (!isAdmin) return;
            
            try {
                const response = await fetch('/api/state');
                const data = await response.json();
                
                if (data.success) {
                    maps = data.maps || {};
                    modes = data.modes || [];
                    renderMaps();
                }
            } catch (error) {
                console.error('Ошибка загрузки карт:', error);
            }
        }
        
        function renderMaps() {
            if (!isAdmin || !maps) return;
            
            const container = document.getElementById('maps-container');
            container.innerHTML = '';
            
            Object.entries(maps).forEach(([mode, modeMaps]) => {
                modeMaps.forEach(map => {
                    const mapOption = document.createElement('div');
                    mapOption.className = 'map-option';
                    mapOption.dataset.mode = mode;
                    mapOption.dataset.name = map.name;
                    
                    mapOption.innerHTML = `
                        <div class="map-option-image">
                            <img src="/static/mappool/${mode}/${map.filename}" alt="${map.name}">
                        </div>
                        <div class="map-option-name">${map.name}</div>
                        <div class="map-option-mode">${mode}</div>
                    `;
                    
                    mapOption.onclick = () => selectMap(map.name, mode);
                    
                    container.appendChild(mapOption);
                });
            });
        }
        
        async function selectMap(mapName, mapMode) {
            if (!isAdmin) return;
            
            try {
                const response = await fetch('/api/select-map', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        admin_key: ADMIN_SECRET,
                        map_name: mapName,
                        map_mode: mapMode
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Снимаем выделение со всех карт
                    document.querySelectorAll('.map-option').forEach(option => {
                        option.classList.remove('selected');
                    });
                    
                    // Выделяем выбранную карту
                    const selectedOption = document.querySelector(`.map-option[data-name="${mapName}"][data-mode="${mapMode}"]`);
                    if (selectedOption) {
                        selectedOption.classList.add('selected');
                    }
                    
                    selectedMapOption = { name: mapName, mode: mapMode };
                    showNotification(`Карта "${mapName}" выбрана`, 'success');
                    loadState();
                } else {
                    showNotification(data.error || 'Ошибка выбора карты', 'error');
                }
            } catch (error) {
                console.error('Ошибка выбора карты:', error);
                showNotification('Ошибка выбора карты', 'error');
            }
        }
        
        async function toggleReady(team) {
            if (!currentTeam || currentTeam !== team) {
                showNotification('Вы не можете управлять готовностью другой команды', 'error');
                return;
            }
            
            const isReady = team === 'blue' ? 
                (draftState?.blue_ready || false) : 
                (draftState?.red_ready || false);
            
            try {
                const endpoint = isReady ? '/api/unready' : '/api/ready';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ team: team })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    showNotification(isReady ? 'Готовность сброшена' : 'Вы готовы!', 'success');
                }
            } catch (error) {
                console.error('Ошибка изменения готовности:', error);
                showNotification('Ошибка изменения готовности', 'error');
            }
        }
        
        async function resetDraft() {
            if (!isAdmin) {
                showNotification('Только администратор может сбросить драфт', 'error');
                return;
            }
            
            if (!confirm('Вы уверены, что хотите сбросить драфт? Все текущие выборы будут потеряны.')) {
                return;
            }
            
            try {
                const response = await fetch('/api/reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        admin_key: ADMIN_SECRET
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    renderBrawlers();
                    showNotification('Драфт сброшен', 'success');
                    
                    if (autoResetTimer) {
                        clearInterval(autoResetTimer);
                        autoResetTimer = null;
                    }
                }
            } catch (error) {
                console.error('Ошибка сброса драфта:', error);
                showNotification('Ошибка сброса драфта', 'error');
            }
        }
        
        async function selectBrawler(brawler) {
            if (!currentTeam) {
                showNotification('Наблюдатели не могут выбирать бравлеров', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/select-brawler', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        brawler: brawler,
                        team: currentTeam
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    renderBrawlers();
                } else {
                    if (data.auto_reset) {
                        showNotification('Драфт был автоматически сброшен через 1 минуту', 'info');
                        loadState();
                    } else {
                        showNotification(data.error || 'Ошибка выбора', 'error');
                    }
                }
            } catch (error) {
                console.error('Ошибка выбора бравлера:', error);
                showNotification('Ошибка выбора бравлера', 'error');
            }
        }
        
        function updateUI() {
            if (!draftState) return;
            
            // Обновляем статус
            updateStatus();
            
            // Обновляем карту и режим
            updateMapDisplay();
            
            // Обновляем готовность команд
            updateReadyStatus();
            
            // Обновляем слоты команд
            updateTeamSlots('blue', draftState.blue_bans, draftState.blue_picks);
            updateTeamSlots('red', draftState.red_bans, draftState.red_picks);
            
            // Обновляем таймер автосброса
            updateAutoResetTimer();
        }
        
        function updateStatus() {
            const statusEl = document.getElementById('status');
            let statusText = '';
            
            switch(draftState.phase) {
                case 'waiting':
                    if (draftState.selected_map) {
                        if (draftState.blue_ready && draftState.red_ready) {
                            statusText = 'ОЖИДАНИЕ НАЧАЛА ДРАФТА';
                        } else {
                            statusText = 'ОЖИДАНИЕ ГОТОВНОСТИ КОМАНД';
                        }
                    } else {
                        statusText = 'ОЖИДАНИЕ ВЫБОРА КАРТЫ';
                    }
                    break;
                    
                case 'ban_blue':
                    statusText = 'БАНИ: СИНЯЯ КОМАНДА';
                    break;
                    
                case 'ban_red':
                    statusText = 'БАНИ: КРАСНАЯ КОМАНДА';
                    break;
                    
                case 'pick':
                    const currentPick = draftState.current_pick_index + 1;
                    const teamTurn = draftState.current_turn === 'blue' ? 'СИНЯЯ' : 'КРАСНАЯ';
                    statusText = `ПИК ${currentPick}/6: ${teamTurn} КОМАНДА`;
                    break;
                    
                case 'finished':
                    statusText = 'ДРАФТ ЗАВЕРШЕН';
                    break;
            }
            
            statusEl.textContent = statusText;
        }
        
        function updateMapDisplay() {
            const mapNameEl = document.getElementById('map-name');
            const mapImageEl = document.getElementById('map-image');
            const modeNameEl = document.getElementById('mode-name');
            const modeIconEl = document.getElementById('mode-icon');
            
            if (draftState.selected_map) {
                mapNameEl.textContent = draftState.selected_map.name;
                mapImageEl.src = `/static/mappool/${draftState.selected_map.mode}/${draftState.selected_map.filename}`;
                mapImageEl.alt = draftState.selected_map.name;
                
                modeNameEl.textContent = draftState.selected_map.mode;
                modeIconEl.src = `/static/modes/${draftState.selected_map.mode}.png`;
                modeIconEl.alt = draftState.selected_map.mode;
            } else {
                mapNameEl.textContent = 'Выберите карту';
                mapImageEl.src = '';
                modeNameEl.textContent = 'Режим';
                modeIconEl.src = '';
            }
        }
        
        function updateReadyStatus() {
            // Синяя команда
            const blueReadyIndicator = document.getElementById('blue-ready-indicator');
            const blueReadyBtn = document.getElementById('blue-ready-btn');
            
            if (draftState.blue_ready) {
                blueReadyIndicator.className = 'ready-indicator ready';
                blueReadyIndicator.innerHTML = '<span>ГОТОВ</span> <span style="font-size:20px;">✅</span>';
                blueReadyBtn.textContent = 'ОТМЕНИТЬ';
                blueReadyBtn.classList.add('unready');
            } else {
                blueReadyIndicator.className = 'ready-indicator not-ready';
                blueReadyIndicator.innerHTML = '<span>НЕ ГОТОВ</span> <span style="font-size:20px;">❌</span>';
                blueReadyBtn.textContent = 'ГОТОВ';
                blueReadyBtn.classList.remove('unready');
            }
            
            // Красная команда
            const redReadyIndicator = document.getElementById('red-ready-indicator');
            const redReadyBtn = document.getElementById('red-ready-btn');
            
            if (draftState.red_ready) {
                redReadyIndicator.className = 'ready-indicator ready';
                redReadyIndicator.innerHTML = '<span>ГОТОВ</span> <span style="font-size:20px;">✅</span>';
                redReadyBtn.textContent = 'ОТМЕНИТЬ';
                redReadyBtn.classList.add('unready');
            } else {
                redReadyIndicator.className = 'ready-indicator not-ready';
                redReadyIndicator.innerHTML = '<span>НЕ ГОТОВ</span> <span style="font-size:20px;">❌</span>';
                redReadyBtn.textContent = 'ГОТОВ';
                redReadyBtn.classList.remove('unready');
            }
        }
        
        function updateTeamSlots(team, bans, picks) {
            const banSlots = document.querySelectorAll(`#${team}-bans .ban-slot`);
            const pickSlots = document.querySelectorAll(`#${team}-picks .pick-slot`);
            
            // Очищаем слоты
            banSlots.forEach(slot => {
                slot.innerHTML = '';
                slot.className = 'ban-slot';
            });
            
            pickSlots.forEach(slot => {
                slot.innerHTML = '';
                slot.classList.remove('active');
            });
            
            // Заполняем баны
            bans.forEach((brawler, index) => {
                if (index < banSlots.length) {
                    if (brawler === 'hidden') {
                        banSlots[index].className = 'ban-slot hidden';
                        banSlots[index].textContent = '?';
                    } else {
                        const imgUrl = `/static/brawler_images/${brawler}.png`;
                        banSlots[index].innerHTML = `<img src="${imgUrl}" alt="${brawler}">`;
                    }
                }
            });
            
            // Заполняем пики
            picks.forEach((brawler, index) => {
                if (index < pickSlots.length) {
                    const imgUrl = `/static/brawler_images/${brawler}.png`;
                    pickSlots[index].innerHTML = `
                        <img src="${imgUrl}" alt="${brawler}">
                        <div class="slot-name">${brawler.toUpperCase()}</div>
                    `;
                    
                    // Подсвечиваем активный слот
                    if (draftState.phase === 'pick' && 
                        draftState.current_turn === team && 
                        index === picks.length) {
                        pickSlots[index].classList.add('active');
                    }
                }
            });
        }
        
        function renderBrawlers() {
            const grid = document.getElementById('brawlers-grid');
            grid.innerHTML = '';
            
            if (!brawlers.length) {
                grid.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">Загрузка бравлеров...</div>';
                return;
            }
            
            // Фильтрация по поиску
            const searchQuery = document.getElementById('search').value.toLowerCase();
            
            brawlers.forEach(brawler => {
                const isSelected = draftState?.all_selected?.includes(brawler) || false;
                
                // Проверяем поиск
                if (searchQuery && !brawler.toLowerCase().includes(searchQuery)) {
                    return;
                }
                
                const card = document.createElement('div');
                card.className = `brawler-card ${isSelected ? 'disabled' : ''}`;
                card.innerHTML = `
                    <img src="/static/brawler_images/${brawler}.png" alt="${brawler}" 
                         onerror="this.onerror=null; this.style.display='none'; this.parentElement.style.background='#333';">
                    <div class="brawler-name">${brawler}</div>
                `;
                
                if (!isSelected && currentTeam && draftState.phase !== 'waiting' && draftState.phase !== 'finished') {
                    card.onclick = () => selectBrawler(brawler);
                }
                
                grid.appendChild(card);
            });
        }
        
        function updateAutoResetTimer() {
            const timerEl = document.getElementById('timer');
            
            if (draftState.phase === 'finished' && draftState.reset_in) {
                let secondsLeft = draftState.reset_in;
                timerEl.textContent = `Автосброс через: ${secondsLeft} сек`;
                
                if (autoResetTimer) {
                    clearInterval(autoResetTimer);
                }
                
                autoResetTimer = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft > 0) {
                        timerEl.textContent = `Автосброс через: ${secondsLeft} сек`;
                    } else {
                        clearInterval(autoResetTimer);
                        autoResetTimer = null;
                        timerEl.textContent = '';
                        loadState();
                    }
                }, 1000);
            } else {
                timerEl.textContent = '';
                if (autoResetTimer) {
                    clearInterval(autoResetTimer);
                    autoResetTimer = null;
                }
            }
        }
        
        async function checkAutoReset() {
            try {
                const response = await fetch('/api/auto-reset-check');
                const data = await response.json();
                
                if (data.auto_reset) {
                    draftState = data.state;
                    updateUI();
                    renderBrawlers();
                    showNotification('Драфт автоматически сброшен через 1 минуту', 'info');
                }
            } catch (error) {
                console.error('Ошибка проверки автосброса:', error);
            }
        }
        
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // Запускаем при загрузке
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
