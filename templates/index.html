<!DOCTYPE html>
<html>
<head>
    <title>Brawl Stars Draft</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background: #111; color: white; font-family: Arial; margin: 0; }
        .header { background: #222; padding: 20px; text-align: center; }
        .container { display: flex; padding: 20px; gap: 20px; }
        .side { width: 200px; background: #333; padding: 15px; border-radius: 10px; }
        .center { flex: 1; background: #333; padding: 20px; border-radius: 10px; }
        #search { width: 100%; padding: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .brawler-card { 
            width: 100px; height: 100px; background: #444; border-radius: 8px; 
            cursor: pointer; display: flex; flex-direction: column; overflow: hidden;
        }
        .brawler-card img { width: 100%; height: 70px; object-fit: contain; padding: 5px; }
        .brawler-name { 
            height: 30px; background: #000; display: flex; align-items: center; 
            justify-content: center; font-size: 10px; text-transform: uppercase;
        }
        .brawler-card.disabled { opacity: 0.3; cursor: not-allowed; }
        .reset-btn { 
            position: fixed; bottom: 20px; right: 20px; 
            background: #e74c3c; color: white; border: none; padding: 15px; 
            border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header" id="status">Brawl Stars Draft</div>
    <div class="container">
        <div class="side" style="border: 2px solid #3498db;">
            <h3 style="color: #3498db;">Синяя команда</h3>
            <div id="blue-bans"></div>
            <div id="blue-picks"></div>
        </div>
        <div class="center">
            <input type="text" id="search" placeholder="Поиск бравлера...">
            <div class="grid" id="grid"></div>
        </div>
        <div class="side" style="border: 2px solid #e74c3c;">
            <h3 style="color: #e74c3c;">Красная команда</h3>
            <div id="red-bans"></div>
            <div id="red-picks"></div>
        </div>
    </div>
    <button class="reset-btn" onclick="resetDraft()">СБРОСИТЬ</button>

    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const myTeam = urlParams.get('team');
        
        let brawlers = [];
        let draftState = {};
        
        socket.on('connect', () => {
            console.log('Подключено');
            showNotification('Подключено к серверу');
        });
        
        socket.on('brawlers_list', (data) => {
            brawlers = data;
            renderBrawlers();
        });
        
        socket.on('update_draft', (data) => {
            draftState = data;
            updateUI();
        });
        
        socket.on('draft_reset', () => {
            showNotification('Драфт сброшен!');
            renderBrawlers();
        });
        
        function renderBrawlers() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            brawlers.forEach(name => {
                const card = document.createElement('div');
                card.className = 'brawler-card';
                if (draftState.all_selected?.includes(name)) {
                    card.classList.add('disabled');
                }
                
                card.innerHTML = `
                    <img src="/static/brawler_images/${name}.png" alt="${name}">
                    <div class="brawler-name">${name}</div>
                `;
                
                card.onclick = () => {
                    if (myTeam && !card.classList.contains('disabled')) {
                        socket.emit('select_brawler', { brawler: name, team: myTeam });
                    }
                };
                
                grid.appendChild(card);
            });
        }
        
        function updateUI() {
            // Обновляем статус
            document.getElementById('status').textContent = 
                draftState.phase === 'finished' ? 'ДРАФТ ЗАВЕРШЕН' : 'Brawl Stars Draft';
            
            // Обновляем слоты команд
            updateTeamSlots('blue', draftState.blue_bans, draftState.blue_picks);
            updateTeamSlots('red', draftState.red_bans, draftState.red_picks);
            
            // Обновляем карточки
            renderBrawlers();
        }
        
        function updateTeamSlots(team, bans, picks) {
            const bansDiv = document.getElementById(`${team}-bans`);
            const picksDiv = document.getElementById(`${team}-picks`);
            
            bansDiv.innerHTML = `<h4>Баны:</h4>` + 
                (bans?.map(b => `<div>${b}</div>`).join('') || '');
            picksDiv.innerHTML = `<h4>Пики:</h4>` + 
                (picks?.map(p => `<div>${p}</div>`).join('') || '');
        }
        
        function resetDraft() {
            if (confirm('Сбросить драфт?')) {
                socket.emit('reset_draft');
            }
        }
        
        function showNotification(msg) {
            alert(msg);
        }
        
        // Поиск
        document.getElementById('search').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('.brawler-card').forEach(card => {
                const name = card.querySelector('.brawler-name').textContent.toLowerCase();
                card.style.display = name.includes(query) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
