<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Draft</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f0f0f; 
            color: white; 
            font-family: Arial, sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        .header { 
            background: #1a1a1a; 
            padding: 20px; 
            text-align: center; 
            font-size: 24px; 
            font-weight: bold;
            border-bottom: 3px solid #333;
        }
        
        .main-content { 
            display: flex; 
            flex: 1; 
            padding: 20px; 
            gap: 20px; 
        }
        
        .side { 
            width: 280px; 
            background: #222; 
            padding: 15px; 
            border-radius: 10px;
            border: 2px solid;
        }
        
        .blue { border-color: #3498db; }
        .red { border-color: #e74c3c; }
        
        .ban-row, .pick-column { 
            margin: 15px 0; 
        }
        
        .ban-slot { 
            width: 60px; 
            height: 60px; 
            background: #333; 
            border: 2px dashed #555; 
            margin: 5px; 
            display: inline-block;
        }
        
        .pick-slot { 
            width: 100%; 
            height: 100px; 
            background: #333; 
            border: 3px solid #555; 
            margin: 10px 0; 
            border-radius: 8px;
        }
        
        .center { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #222; 
            padding: 20px; 
            border-radius: 10px;
        }
        
        #search { 
            padding: 15px; 
            background: #333; 
            border: 2px solid #555; 
            color: white; 
            font-size: 16px; 
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .grid { 
            flex: 1; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 10px; 
            overflow-y: auto; 
            padding: 10px;
        }
        
        .brawler-card { 
            width: 100px; 
            height: 100px; 
            background: #333; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            border: 2px solid transparent;
        }
        
        .brawler-card:hover { 
            transform: scale(1.05); 
            border-color: #3498db;
        }
        
        .brawler-card.disabled { 
            opacity: 0.3; 
            cursor: not-allowed; 
        }
        
        .brawler-card img { 
            width: 100%; 
            height: 70px; 
            object-fit: contain; 
            padding: 5px;
        }
        
        .brawler-name { 
            height: 30px; 
            background: rgba(0,0,0,0.8); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px; 
            font-weight: bold; 
            text-transform: uppercase;
        }
        
        .reset-btn { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: #e74c3c; 
            color: white; 
            border: none; 
            padding: 15px 25px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #3498db;
            color: white;
            padding: 15px;
            border-radius: 8px;
            animation: fadeInOut 3s;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header" id="status">Brawl Stars Draft</div>
    
    <div class="main-content">
        <!-- Синяя команда -->
        <div class="side blue">
            <h3 style="color: #3498db; text-align: center;">СИНЯЯ КОМАНДА</h3>
            <div class="ban-row" id="blue-bans-ui">
                <div class="ban-slot"></div>
                <div class="ban-slot"></div>
                <div class="ban-slot"></div>
            </div>
            <div class="pick-column" id="blue-picks-ui">
                <div class="pick-slot"></div>
                <div class="pick-slot"></div>
                <div class="pick-slot"></div>
            </div>
        </div>
        
        <!-- Центр -->
        <div class="center">
            <input type="text" id="search" placeholder="Поиск бравлера..." autocomplete="off">
            <div class="grid" id="grid">
                <!-- Бравлеры загружаются динамически -->
            </div>
        </div>
        
        <!-- Красная команда -->
        <div class="side red">
            <h3 style="color: #e74c3c; text-align: center;">КРАСНАЯ КОМАНДА</h3>
            <div class="ban-row" id="red-bans-ui">
                <div class="ban-slot"></div>
                <div class="ban-slot"></div>
                <div class="ban-slot"></div>
            </div>
            <div class="pick-column" id="red-picks-ui">
                <div class="pick-slot"></div>
                <div class="pick-slot"></div>
                <div class="pick-slot"></div>
            </div>
        </div>
    </div>
    
    <button class="reset-btn" onclick="resetDraft()">СБРОСИТЬ</button>
    
    <div id="notification"></div>
    
    <script>
        // Инициализация
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const myTeam = urlParams.get('team'); // blue, red, или null
        
        let brawlers = [];
        let draftState = {
            blue_bans: [], blue_picks: [],
            red_bans: [], red_picks: [],
            all_selected: [], phase: 'waiting'
        };
        
        // Подключение к серверу
        socket.on('connect', function() {
            console.log('Подключено к серверу');
            socket.emit('join', { team: myTeam });
            showNotification('Подключено к серверу');
        });
        
        // Получаем список бравлеров
        socket.on('brawlers_list', function(serverBrawlers) {
            console.log('Получены бравлеры:', serverBrawlers);
            brawlers = serverBrawlers;
            renderBrawlers();
        });
        
        // Обновление состояния драфта
        socket.on('update_draft', function(data) {
            console.log('Обновление драфта:', data);
            draftState = data;
            updateUI();
        });
        
        // Сброс драфта
        socket.on('draft_reset', function() {
            showNotification('Драфт сброшен!');
            renderBrawlers();
        });
        
        // Рендер бравлеров
        function renderBrawlers() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            brawlers.forEach(name => {
                const card = document.createElement('div');
                card.className = 'brawler-card';
                card.id = 'card-' + name;
                
                // Проверяем, выбран ли бравлер
                if (draftState.all_selected.includes(name)) {
                    card.classList.add('disabled');
                }
                
                // Создаем карточку
                card.innerHTML = `
                    <img src="/static/brawler_images/${name}.png" alt="${name}" 
                         onerror="this.onerror=null; this.src='https://via.placeholder.com/100/333/fff?text=${name[0]}'">
                    <div class="brawler-name">${name}</div>
                `;
                
                // Обработчик клика
                card.onclick = function() {
                    if (myTeam && !card.classList.contains('disabled')) {
                        socket.emit('select_brawler', {
                            brawler: name,
                            team: myTeam
                        });
                    }
                };
                
                grid.appendChild(card);
            });
            
            console.log(`Отображено ${brawlers.length} бравлеров`);
        }
        
        // Обновление UI
        function updateUI() {
            // Обновляем статус
            const status = document.getElementById('status');
            switch(draftState.phase) {
                case 'waiting': status.textContent = 'ОЖИДАНИЕ...'; break;
                case 'ban': status.textContent = 'ФАЗА БАНОВ'; break;
                case 'pick': status.textContent = 'ФАЗА ВЫБОРА'; break;
                case 'finished': status.textContent = 'ДРАФТ ЗАВЕРШЕН'; break;
            }
            
            // Обновляем слоты
            updateSlots('blue', draftState.blue_bans, draftState.blue_picks);
            updateSlots('red', draftState.red_bans, draftState.red_picks);
            
            // Обновляем карточки бравлеров
            renderBrawlers();
        }
        
        // Обновление слотов команды
        function updateSlots(team, bans, picks) {
            const banSlots = document.querySelectorAll(`.${team} .ban-slot`);
            const pickSlots = document.querySelectorAll(`.${team} .pick-slot`);
            
            // Бан слоты
            bans.forEach((name, i) => {
                if (i < banSlots.length) {
                    banSlots[i].innerHTML = name ? 
                        `<img src="/static/brawler_images/${name}.png" style="width:100%; height:100%; object-fit:cover; filter:grayscale(1)">` : 
                        '';
                }
            });
            
            // Пик слоты
            picks.forEach((name, i) => {
                if (i < pickSlots.length) {
                    pickSlots[i].innerHTML = name ? 
                        `<div style="width:100%; height:100%; display:flex; flex-direction:column;">
                            <img src="/static/brawler_images/${name}.png" style="flex:1; object-fit:cover;">
                            <div style="background:rgba(0,0,0,0.8); padding:5px; text-align:center; font-size:12px;">${name}</div>
                         </div>` : 
                        '';
                }
            });
        }
        
        // Поиск бравлеров
        document.getElementById('search').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            brawlers.forEach(name => {
                const card = document.getElementById('card-' + name);
                if (card) {
                    card.style.display = name.toLowerCase().includes(query) ? 'flex' : 'none';
                }
            });
        });
        
        // Сброс драфта
        function resetDraft() {
            if (confirm('Сбросить драфт?')) {
                socket.emit('reset_draft');
            }
        }
        
        // Показать уведомление
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        // Загрузка при старте
        document.addEventListener('DOMContentLoaded', function() {
            // Показываем информацию о команде
            if (myTeam === 'blue') {
                showNotification('Вы играете за СИНЮЮ команду');
            } else if (myTeam === 'red') {
                showNotification('Вы играете за КРАСНУЮ команду');
            } else {
                showNotification('Вы наблюдатель');
            }
        });
    </script>
</body>
</html>
