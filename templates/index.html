<!DOCTYPE html>
<html>
<head>
    <title>Brawl Stars Pro Draft</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --blue: #3498db; --red: #e74c3c; --bg: #0f0f0f; }
        body { background: var(--bg); color: white; font-family: 'Arial Black', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { height: 80px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 24px; border-bottom: 3px solid #333; }

        .main-content { display: flex; flex: 1; padding: 10px; gap: 20px; }

        /* Стороны команд */
        .side { width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .ban-row { display: flex; gap: 10px; justify-content: center; }
        .ban-slot { width: 60px; height: 60px; background: #222; border: 2px solid #444; position: relative; overflow: hidden; }
        .pick-column { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .pick-slot { width: 180px; height: 180px; background: #222; border: 4px solid #444; position: relative; overflow: hidden; border-radius: 10px; }
        
        .blue .pick-slot.active { border-color: var(--blue); box-shadow: 0 0 20px var(--blue); }
        .red .pick-slot.active { border-color: var(--red); box-shadow: 0 0 20px var(--red); }

        /* Центр */
        .center { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        #search { width: 100%; padding: 15px; background: #222; border: none; color: white; font-size: 18px; border-radius: 5px; }
        .grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; overflow-y: auto; padding-right: 5px; }
        
        .brawler-card { background: #1a1a1a; border-radius: 5px; cursor: pointer; position: relative; transition: 0.2s; border: 2px solid transparent; }
        .brawler-card:hover { transform: scale(1.05); }
        .brawler-card img { width: 100%; display: block; border-radius: 3px; }
        .brawler-card .name { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); font-size: 10px; text-align: center; }
        .brawler-card.disabled { opacity: 0.2; filter: grayscale(1); cursor: not-allowed; }

        .slot-img { width: 100%; height: 100%; object-fit: cover; }
        .slot-name { position: absolute; bottom: 5px; width: 100%; text-align: center; text-shadow: 2px 2px 2px black; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header" id="status">ОЖИДАНИЕ ИГРОКОВ...</div>

    <div class="main-content">
        <!-- BLUE SIDE -->
        <div class="side blue">
            <div class="ban-row" id="blue-bans-ui">
                <div class="ban-slot"></div><div class="ban-slot"></div><div class="ban-slot"></div>
            </div>
            <div class="pick-column" id="blue-picks-ui">
                <div class="pick-slot"></div><div class="pick-slot"></div><div class="pick-slot"></div>
            </div>
        </div>

        <!-- CENTER -->
        <div class="center">
            <input type="text" id="search" placeholder="ПОИСК БОЙЦА..." oninput="filterBrawlers()">
            <div class="grid" id="grid"></div>
        </div>

        <!-- RED SIDE -->
        <div class="side red">
            <div class="ban-row" id="red-bans-ui">
                <div class="ban-slot"></div><div class="ban-slot"></div><div class="ban-slot"></div>
            </div>
            <div class="pick-column" id="red-picks-ui">
                <div class="pick-slot"></div><div class="pick-slot"></div><div class="pick-slot"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const myTeam = urlParams.get('team'); // blue, red, или null (spectator)
        
        const brawlers = ["Shelly", "Nita", "Colt", "Bull", "Brock", "El Primo", "Barley", "Poco", "Rosa", "Jessie", "Dynamike", "Tick", "8-Bit", "Rico", "Darryl", "Penny", "Carl", "Jacky", "Piper", "Pam", "Frank", "Bibi", "Bea", "Nani", "Edgar", "Mortis", "Tara", "Gene", "Max", "Mr. P", "Sprout", "Byron", "Squeak", "Spike", "Crow", "Leon", "Sandy", "Amber", "Meg", "Gale", "Surge", "Colette", "Lou", "Ruffs", "Belle", "Buzz", "Ash", "Lola", "Fang", "Eve", "Janet", "Otis"];

        // Инициализация
        socket.emit('join', { team: myTeam });

        function createGrid() {
            const grid = document.getElementById('grid');
            brawlers.sort().forEach(name => {
                const card = document.createElement('div');
                card.className = 'brawler-card';
                card.id = 'card-' + name;
                card.innerHTML = `<img src="/static/brawler_images/${name}.png"><div class="name">${name.toUpperCase()}</div>`;
                card.onclick = () => {
                    if(myTeam) socket.emit('select_brawler', { brawler: name, team: myTeam });
                };
                grid.appendChild(card);
            });
        }

        function filterBrawlers() {
            const query = document.getElementById('search').value.toLowerCase();
            brawlers.forEach(name => {
                const card = document.getElementById('card-' + name);
                card.style.display = name.toLowerCase().includes(query) ? 'block' : 'none';
            });
        }

        socket.on('update_draft', (data) => {
            // Статус
            const statusEl = document.getElementById('status');
            if(data.phase === 'waiting') statusEl.innerText = "ОЖИДАНИЕ СОПЕРНИКА...";
            if(data.phase === 'ban') statusEl.innerText = "ФАЗА БАНОВ (СКРЫТО)";
            if(data.phase === 'pick') statusEl.innerText = "ХОД: " + data.picking_order[data.turn_index].toUpperCase();
            if(data.phase === 'finished') statusEl.innerText = "ДРАФТ ЗАВЕРШЕН";

            // Обновление банов и пиков
            updateSlots('blue', data.blue_bans, data.blue_picks, data.phase, data.picking_order[data.turn_index]);
            updateSlots('red', data.red_bans, data.red_picks, data.phase, data.picking_order[data.turn_index]);

            // Блокировка иконок
            data.all_selected.forEach(name => {
                document.getElementById('card-' + name).classList.add('disabled');
            });
        });

        function updateSlots(team, bans, picks, phase, currentTurn) {
            const banSlots = document.querySelectorAll(`.${team} .ban-slot`);
            const pickSlots = document.querySelectorAll(`.${team} .pick-slot`);

            bans.forEach((name, i) => {
                if(name) banSlots[i].innerHTML = `<img class="slot-img" src="/static/brawler_images/${name}.png" style="filter:grayscale(1)">`;
            });

            picks.forEach((name, i) => {
                if(name) pickSlots[i].innerHTML = `<img class="slot-img" src="/static/brawler_images/${name}.png"><div class="slot-name">${name.toUpperCase()}</div>`;
                pickSlots[i].classList.toggle('active', phase === 'pick' && currentTurn === team);
            });
        }

        createGrid();
    </script>
</body>
</html>
