<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Draft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f0f0f; 
            color: white; 
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header { 
            background: #1a1a1a; 
            padding: 20px; 
            text-align: center; 
            font-size: 24px; 
            font-weight: bold;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #333;
        }
        
        .map-section {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #444;
        }
        
        .map-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .map-image {
            max-width: 600px;
            height: 300px;
            border-radius: 10px;
            overflow: hidden;
            border: 4px solid #555;
            position: relative;
        }
        
        .map-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .map-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .mode-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #fff;
        }
        
        .mode-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .map-name {
            font-size: 24px;
            font-weight: bold;
            color: #f39c12;
        }
        
        .mode-name {
            font-size: 20px;
            color: #3498db;
            text-transform: uppercase;
        }
        
        .map-selector {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .mode-tab {
            padding: 10px 20px;
            background: #333;
            border: 2px solid #444;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .mode-tab.active {
            background: #3498db;
            border-color: #3498db;
        }
        
        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .map-card {
            background: #333;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        
        .map-card:hover {
            transform: scale(1.05);
            border-color: #2ecc71;
        }
        
        .map-card.selected {
            border-color: #3498db;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.5);
        }
        
        .map-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        
        .map-card-name {
            padding: 10px;
            text-align: center;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .draft-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .team-side {
            width: 350px;
            background: #222; 
            padding: 20px; 
            border-radius: 10px;
            border: 3px solid;
        }
        
        .team-blue { border-color: #3498db; }
        .team-red { border-color: #e74c3c; }
        
        .team-header {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid;
        }
        
        .team-blue .team-header { color: #3498db; border-color: #3498db; }
        .team-red .team-header { color: #e74c3c; border-color: #e74c3c; }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .bans-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .ban-slot {
            width: 80px;
            height: 80px;
            background: #444;
            border: 3px dashed #666;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #666;
            font-weight: bold;
        }
        
        .ban-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) brightness(0.6);
        }
        
        .picks-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        
        .pick-slot {
            width: 200px;
            height: 200px;
            background: #444;
            border: 4px solid #666;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .pick-slot.active {
            border-color: #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(46, 204, 113, 0.5); }
            50% { box-shadow: 0 0 30px rgba(46, 204, 113, 0.8); }
        }
        
        .pick-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .slot-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            padding: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .center-panel {
            flex: 1;
            background: #222;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
        }
        
        .search-box {
            padding: 15px;
            background: #333;
            border: 2px solid #444;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .brawlers-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            overflow-y: auto;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 8px;
            max-height: 500px;
        }
        
        .brawler-card {
            width: 100px;
            height: 100px;
            background: #333;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .brawler-card:hover {
            transform: scale(1.05);
            border-color: #3498db;
        }
        
        .brawler-card.disabled {
            opacity: 0.3;
            filter: grayscale(1);
            cursor: not-allowed;
        }
        
        .brawler-card img {
            width: 100%;
            height: 70px;
            object-fit: contain;
            padding: 5px;
        }
        
        .brawler-name {
            height: 30px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-ready {
            background: #2ecc71;
            color: white;
        }
        
        .btn-reset {
            background: #e74c3c;
            color: white;
        }
        
        .btn-select {
            background: #3498db;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #3498db;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s, fadeOut 0.3s 2.7s forwards;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            to { opacity: 0; }
        }
        
        .timer {
            font-size: 14px;
            color: #f39c12;
            text-align: center;
            margin-top: 10px;
        }
        
        .role-info {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
        }
        
        .role-blue { background: rgba(52, 152, 219, 0.2); color: #3498db; }
        .role-red { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .role-spectator { background: rgba(149, 165, 166, 0.2); color: #95a5a6; }
        .role-admin { background: rgba(155, 89, 182, 0.2); color: #9b59b6; }
        
        .ready-status {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .status-blue { color: #3498db; }
        .status-red { color: #e74c3c; }
        .status-ready { color: #2ecc71; font-weight: bold; }
        .status-waiting { color: #f39c12; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" id="status">Brawl Stars Draft</div>
        
        <div class="role-info" id="role-info"></div>
        
        <!-- Отображение выбранной карты -->
        <div class="map-section" id="map-section">
            <h3>ВЫБРАННАЯ КАРТА</h3>
            <div class="map-container" id="map-container">
                <div class="map-image" id="map-image">
                    <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #666;">
                        Карта не выбрана
                    </div>
                </div>
                <div class="map-info" id="map-info">
                    <div class="map-name" id="map-name">—</div>
                    <div class="mode-name" id="mode-name">—</div>
                    <div class="mode-icon" id="mode-icon">
                        <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #666;">
                            ?
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Выбор карты (только для админа) -->
            <div class="map-selector" id="map-selector" style="display: none;">
                <h3>ВЫБОР КАРТЫ</h3>
                <div class="mode-tabs" id="mode-tabs">
                    <!-- Вкладки режимов будут созданы динамически -->
                </div>
                <div class="maps-grid" id="maps-grid">
                    <!-- Карты будут загружены динамически -->
                </div>
                <div class="controls" style="margin-top: 20px;">
                    <button class="btn btn-select" onclick="selectMap()">ВЫБРАТЬ КАРТУ</button>
                </div>
            </div>
        </div>
        
        <!-- Статус готовности команд -->
        <div class="ready-status" id="ready-status">
            <div class="status-blue" id="blue-status">Синяя команда: <span id="blue-ready">ОЖИДАЕТ</span></div>
            <div class="status-red" id="red-status">Красная команда: <span id="red-ready">ОЖИДАЕТ</span></div>
        </div>
        
        <div class="draft-container">
            <!-- Синяя команда -->
            <div class="team-side team-blue">
                <div class="team-header">СИНЯЯ КОМАНДА</div>
                
                <div class="section">
                    <div class="section-title">БАНЫ (3)</div>
                    <div class="bans-row" id="blue-bans">
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">ПИКИ (3)</div>
                    <div class="picks-column" id="blue-picks">
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                    </div>
                </div>
                
                <!-- Кнопка готовности для синей команды -->
                <div class="controls" id="blue-controls" style="display: none;">
                    <button class="btn btn-ready" onclick="setReady()">ГОТОВ</button>
                </div>
            </div>
            
            <!-- Центральная панель выбора бравлеров -->
            <div class="center-panel">
                <input type="text" class="search-box" id="search" placeholder="Поиск бравлера..." autocomplete="off">
                
                <div class="brawlers-grid" id="brawlers-grid">
                    <!-- Бравлеры будут загружены здесь -->
                </div>
                
                <!-- Кнопки управления (админ и сброс) -->
                <div class="controls">
                    <button class="btn btn-reset" onclick="resetDraft()" id="reset-btn" style="display: none;">СБРОСИТЬ ДРАФТ</button>
                </div>
                
                <div class="timer" id="timer"></div>
            </div>
            
            <!-- Красная команда -->
            <div class="team-side team-red">
                <div class="team-header">КРАСНАЯ КОМАНДА</div>
                
                <div class="section">
                    <div class="section-title">БАНЫ (3)</div>
                    <div class="bans-row" id="red-bans">
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                        <div class="ban-slot"></div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">ПИКИ (3)</div>
                    <div class="picks-column" id="red-picks">
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                        <div class="pick-slot"></div>
                    </div>
                </div>
                
                <!-- Кнопка готовности для красной команды -->
                <div class="controls" id="red-controls" style="display: none;">
                    <button class="btn btn-ready" onclick="setReady()">ГОТОВ</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="notification-container"></div>
    
    <script>
        let currentRole = '{{ role }}';
        let brawlers = [];
        let draftState = null;
        let autoResetTimer = null;
        let availableMaps = {};
        let selectedMap = null;
        let selectedMode = null;
        
        function updateRoleInfo() {
            const roleInfo = document.getElementById('role-info');
            let roleText = '';
            let roleClass = '';
            
            switch(currentRole) {
                case 'blue':
                    roleText = 'ВЫ ИГРАЕТЕ ЗА СИНЮЮ КОМАНДУ';
                    roleClass = 'role-blue';
                    break;
                case 'red':
                    roleText = 'ВЫ ИГРАЕТЕ ЗА КРАСНУЮ КОМАНДУ';
                    roleClass = 'role-red';
                    break;
                case 'admin':
                    roleText = 'ВЫ АДМИНИСТРАТОР';
                    roleClass = 'role-admin';
                    break;
                default:
                    roleText = 'ВЫ НАБЛЮДАТЕЛЬ';
                    roleClass = 'role-spectator';
            }
            
            roleInfo.textContent = roleText;
            roleInfo.className = 'role-info ' + roleClass;
            
            // Показываем/скрываем кнопки готовности
            document.getElementById('blue-controls').style.display = currentRole === 'blue' ? 'flex' : 'none';
            document.getElementById('red-controls').style.display = currentRole === 'red' ? 'flex' : 'none';
            document.getElementById('reset-btn').style.display = currentRole === 'admin' ? 'block' : 'none';
            document.getElementById('map-selector').style.display = currentRole === 'admin' ? 'block' : 'none';
        }
        
        async function loadState() {
            try {
                const response = await fetch(`/api/state?role=${currentRole}`);
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    brawlers = data.brawlers || [];
                    currentRole = data.role || currentRole;
                    
                    updateRoleInfo();
                    updateUI();
                    renderBrawlers();
                    
                    // Загружаем карты если мы админ
                    if (currentRole === 'admin' && !availableMaps.modes) {
                        loadMaps();
                    }
                }
            } catch (error) {
                console.error('Ошибка загрузки состояния:', error);
            }
        }
        
        async function setReady() {
            try {
                const response = await fetch('/api/ready', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        role: currentRole
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    showNotification('Вы готовы! Ожидаем вторую команду...');
                }
            } catch (error) {
                console.error('Ошибка установки готовности:', error);
            }
        }
        
        async function resetDraft() {
            if (!confirm('Сбросить драфт? Все текущие выборы будут потеряны.')) {
                return;
            }
            
            try {
                const response = await fetch('/api/reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    renderBrawlers();
                    showNotification('Драфт сброшен!');
                    
                    if (autoResetTimer) {
                        clearInterval(autoResetTimer);
                        autoResetTimer = null;
                    }
                }
            } catch (error) {
                console.error('Ошибка сброса драфта:', error);
                showNotification('Только администратор может сбросить драфт');
            }
        }
        
        async function selectBrawler(brawler) {
            if (currentRole !== 'blue' && currentRole !== 'red') {
                showNotification('Только игроки могут выбирать бравлеров');
                return;
            }
            
            try {
                const response = await fetch('/api/select', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        brawler: brawler,
                        role: currentRole
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    renderBrawlers();
                } else {
                    if (data.auto_reset) {
                        showNotification('Драфт был автоматически сброшен через 1 минуту');
                        loadState();
                    } else {
                        showNotification(data.error || 'Ошибка выбора');
                    }
                }
            } catch (error) {
                console.error('Ошибка выбора бравлера:', error);
            }
        }
        
        function updateUI() {
            if (!draftState) return;
            
            // Обновляем статус
            const statusEl = document.getElementById('status');
            let statusText = '';
            
            switch(draftState.phase) {
                case 'waiting':
                    statusText = 'ОЖИДАНИЕ ГОТОВНОСТИ КОМАНД';
                    break;
                case 'ban_blue':
                    statusText = 'БАНИ: СИНЯЯ КОМАНДА';
                    break;
                case 'ban_red':
                    statusText = 'БАНИ: КРАСНАЯ КОМАНДА';
                    break;
                case 'pick':
                    const currentPick = draftState.current_pick_index + 1;
                    const teamTurn = draftState.current_turn === 'blue' ? 'СИНЯЯ' : 'КРАСНАЯ';
                    statusText = `ПИК ${currentPick}/6: ${teamTurn} КОМАНДА`;
                    break;
                case 'finished':
                    statusText = 'ДРАФТ ЗАВЕРШЕН';
                    break;
            }
            
            statusEl.textContent = statusText;
            
            // Обновляем статус готовности команд
            document.getElementById('blue-ready').textContent = 
                draftState.blue_ready ? 'ГОТОВ' : 'ОЖИДАЕТ';
            document.getElementById('blue-ready').className = 
                draftState.blue_ready ? 'status-ready' : 'status-waiting';
            
            document.getElementById('red-ready').textContent = 
                draftState.red_ready ? 'ГОТОВ' : 'ОЖИДАЕТ';
            document.getElementById('red-ready').className = 
                draftState.red_ready ? 'status-ready' : 'status-waiting';
            
            // Обновляем отображение карты
            updateMapDisplay();
            
            // Обновляем таймер автосброса
            const timerEl = document.getElementById('timer');
            if (draftState.phase === 'finished' && draftState.reset_in) {
                timerEl.textContent = `Автосброс через: ${draftState.reset_in} сек`;
                
                if (autoResetTimer) {
                    clearInterval(autoResetTimer);
                }
                
                let secondsLeft = draftState.reset_in;
                autoResetTimer = setInterval(() => {
                    secondsLeft--;
                    timerEl.textContent = `Автосброс через: ${secondsLeft} сек`;
                    
                    if (secondsLeft <= 0) {
                        clearInterval(autoResetTimer);
                        autoResetTimer = null;
                        loadState();
                    }
                }, 1000);
            } else {
                timerEl.textContent = '';
                if (autoResetTimer) {
                    clearInterval(autoResetTimer);
                    autoResetTimer = null;
                }
            }
            
            // Обновляем слоты команд
            updateTeamSlots('blue', draftState.blue_bans, draftState.blue_picks);
            updateTeamSlots('red', draftState.red_bans, draftState.red_picks);
        }
        
        function updateTeamSlots(team, bans, picks) {
            const banSlots = document.querySelectorAll(`#${team}-bans .ban-slot`);
            const pickSlots = document.querySelectorAll(`#${team}-picks .pick-slot`);
            
            // Очищаем все слоты
            banSlots.forEach(slot => {
                slot.innerHTML = '';
                slot.style.background = '#444';
                slot.style.borderStyle = 'dashed';
            });
            
            pickSlots.forEach(slot => {
                slot.innerHTML = '';
                slot.classList.remove('active');
            });
            
            // Заполняем баны
            bans.forEach((brawler, index) => {
                if (index < banSlots.length) {
                    if (brawler === 'hidden') {
                        banSlots[index].textContent = '?';
                        banSlots[index].style.background = '#333';
                    } else {
                        const imgUrl = `/static/brawler_images/${brawler}.png`;
                        banSlots[index].innerHTML = `<img src="${imgUrl}" alt="${brawler}">`;
                        banSlots[index].style.borderStyle = 'solid';
                    }
                }
            });
            
            // Заполняем пики
            picks.forEach((brawler, index) => {
                if (index < pickSlots.length) {
                    const imgUrl = `/static/brawler_images/${brawler}.png`;
                    pickSlots[index].innerHTML = `
                        <img src="${imgUrl}" alt="${brawler}">
                        <div class="slot-name">${brawler.toUpperCase()}</div>
                    `;
                    
                    // Подсвечиваем активный слот
                    if (draftState.phase === 'pick' && 
                        draftState.current_turn === team && 
                        index === picks.length) {
                        pickSlots[index].classList.add('active');
                    }
                }
            });
        }
        
        function updateMapDisplay() {
            if (draftState.selected_map) {
                document.getElementById('map-name').textContent = draftState.selected_map.name;
                document.getElementById('mode-name').textContent = draftState.selected_map.mode;
                
                // Устанавливаем картинку карты
                const mapImage = document.getElementById('map-image');
                mapImage.innerHTML = `<img src="/static/mappool/${draftState.selected_map.mode}/${draftState.selected_map.file}" alt="${draftState.selected_map.name}">`;
                
                // Устанавливаем иконку режима
                const modeIcon = document.getElementById('mode-icon');
                modeIcon.innerHTML = `<img src="/static/modes/${draftState.selected_map.mode}.png" alt="${draftState.selected_map.mode}">`;
            }
        }
        
        async function loadMaps() {
            try {
                const response = await fetch('/api/maps');
                const data = await response.json();
                
                if (data.success) {
                    availableMaps = data.maps;
                    renderModeTabs();
                }
            } catch (error) {
                console.error('Ошибка загрузки карт:', error);
            }
        }
        
        function renderModeTabs() {
            const modeTabs = document.getElementById('mode-tabs');
            modeTabs.innerHTML = '';
            
            Object.keys(availableMaps).forEach((mode, index) => {
                const tab = document.createElement('div');
                tab.className = `mode-tab ${index === 0 ? 'active' : ''}`;
                tab.textContent = mode.replace('_', ' ');
                tab.onclick = () => {
                    // Убираем активный класс у всех вкладок
                    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                    // Добавляем активный класс текущей вкладке
                    tab.classList.add('active');
                    // Рендерим карты для выбранного режима
                    selectedMode = mode;
                    renderMapsForMode(mode);
                };
                
                modeTabs.appendChild(tab);
            });
            
            // Рендерим карты для первого режима
            if (Object.keys(availableMaps).length > 0) {
                selectedMode = Object.keys(availableMaps)[0];
                renderMapsForMode(selectedMode);
            }
        }
        
        function renderMapsForMode(mode) {
            const mapsGrid = document.getElementById('maps-grid');
            mapsGrid.innerHTML = '';
            
            if (availableMaps[mode]) {
                availableMaps[mode].forEach(mapInfo => {
                    const mapCard = document.createElement('div');
                    mapCard.className = 'map-card';
                    mapCard.innerHTML = `
                        <img src="/static/mappool/${mode}/${mapInfo.file}" alt="${mapInfo.name}">
                        <div class="map-card-name">${mapInfo.name.replace('_', ' ')}</div>
                    `;
                    
                    mapCard.onclick = () => {
                        // Убираем выделение у всех карт
                        document.querySelectorAll('.map-card').forEach(card => {
                            card.classList.remove('selected');
                        });
                        // Выделяем выбранную карту
                        mapCard.classList.add('selected');
                        selectedMap = mapInfo.name;
                    };
                    
                    mapsGrid.appendChild(mapCard);
                });
            }
        }
        
        async function selectMap() {
            if (!selectedMap || !selectedMode) {
                showNotification('Выберите карту');
                return;
            }
            
            try {
                const response = await fetch('/api/select_map', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        map_name: selectedMap,
                        map_mode: selectedMode
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    draftState = data.state;
                    updateUI();
                    showNotification(`Карта ${selectedMap} выбрана!`);
                    
                    // Снимаем выделение с карты
                    selectedMap = null;
                    document.querySelectorAll('.map-card').forEach(card => {
                        card.classList.remove('selected');
                    });
                } else {
                    showNotification(data.error || 'Ошибка выбора карты');
                }
            } catch (error) {
                console.error('Ошибка выбора карты:', error);
            }
        }
        
        function renderBrawlers() {
            const grid = document.getElementById('brawlers-grid');
            grid.innerHTML = '';
            
            if (!brawlers.length) {
                grid.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">Загрузка бравлеров...</div>';
                return;
            }
            
            // Фильтрация по поиску
            const searchQuery = document.getElementById('search').value.toLowerCase();
            
            brawlers.forEach(brawler => {
                const isSelected = draftState?.all_selected?.includes(brawler) || false;
                
                // Проверяем поиск
                if (searchQuery && !brawler.toLowerCase().includes(searchQuery)) {
                    return;
                }
                
                const card = document.createElement('div');
                card.className = `brawler-card ${isSelected ? 'disabled' : ''}`;
                card.innerHTML = `
                    <img src="/static/brawler_images/${brawler}.png" alt="${brawler}">
                    <div class="brawler-name">${brawler}</div>
                `;
                
                if (!isSelected && (currentRole === 'blue' || currentRole === 'red')) {
                    card.onclick = () => selectBrawler(brawler);
                } else if (isSelected) {
                    card.style.cursor = 'not-allowed';
                }
                
                grid.appendChild(card);
            });
        }
        
        function showNotification(message) {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            updateRoleInfo();
            loadState();
            
            // Настраиваем поиск
            document.getElementById('search').addEventListener('input', renderBrawlers);
            
            // Автообновление состояния каждые 2 секунды
            setInterval(loadState, 2000);
        });
    </script>
</body>
</html>
