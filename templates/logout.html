<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выход - Brawl Stars Draft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f0f0f; 
            color: white; 
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            background: #222;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid #2ecc71;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #2ecc71;
        }
        
        h1 {
            color: #2ecc71;
            margin-bottom: 20px;
            font-size: 32px;
        }
        
        .message {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ccc;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
            margin: 10px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }
        
        .links {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }
        
        .link-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }
        
        .link-icon {
            font-size: 24px;
        }
        
        .blue { color: #3498db; }
        .red { color: #e74c3c; }
        .purple { color: #9b59b6; }
        .gray { color: #95a5a6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>ВЫ УСПЕШНО ВЫШЛИ</h1>
        
        <div class="message">
            Ваша сессия завершена. Теперь другие игроки могут занять ваше место.
            Выберите новую роль для продолжения:
        </div>
        
        <div class="links">
            <a href="/blue" class="link-item">
                <span class="link-icon blue">🔵</span>
                <span>Синяя команда</span>
            </a>
            
            <a href="/red" class="link-item">
                <span class="link-icon red">🔴</span>
                <span>Красная команда</span>
            </a>
            
            <a href="/" class="link-item">
                <span class="link-icon gray">👁️</span>
                <span>Наблюдатель</span>
            </a>
            
            <a href="/admin/admin_9605183db62b41bd" class="link-item">
                <span class="link-icon purple">👑</span>
                <span>Администратор</span>
            </a>
        </div>
    </div>
</body>
</html>
